// core-banking: 수신(deposit) + 결제(payment) 병합 모듈
//
// 두 서비스를 합친 이유와 Saga 를 남긴 이유는 docs/decisions/core-banking-merge.md 참조.
// 요약: 자행이체는 우리 DB 안에서 끝나므로 로컬 트랜잭션으로 처리하고,
//       타행이체(KFTC/BOK)는 상대 은행 DB에 트랜잭션을 걸 수 없으므로 Saga 를 유지한다.
//
// 영속 계층이 둘이다 — deposit 은 JPA, payment 는 MyBatis.
// 병합하면서 한쪽으로 통일하지 않은 것은 의도적이다. 경계 재조정과 영속 프레임워크
// 재작성을 동시에 하면 실패 원인을 분리할 수 없다. 둘 다 같은 DataSource 를 쓰므로
// JpaTransactionManager 아래에서 하나의 트랜잭션에 참여한다.

bootJar { enabled = true }
jar { enabled = false }   // plain JAR 제거 → Dockerfile COPY build/libs/*.jar 단일 매칭

// docker-java 3.3.6(testcontainers 1.19.8) + Docker Desktop 4.69.0 호환 불가
// → testcontainers 1.21.0 으로 올려 docker-java 3.5.x 사용
ext['testcontainers.version'] = '1.21.0'

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:2023.0.3"
    }
}

dependencies {
    // --- 수신(deposit) 계열 ---
    // local 프로필(application-local.yml)에서 H2 인메모리 DB로 bootRun 하기 위해 필요
    runtimeOnly 'com.h2database:h2'

    // --- 결제(payment) 계열 ---
    // MyBatis (기술스택 정의서 v2.2: MyBatis 3.0.x, KB 결제계 표준)
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.4'
    testImplementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter-test:3.0.4'

    // Kafka (3 클러스터: KFTC / BOK / Internal) — 타행이체 Saga 에 계속 쓰인다
    implementation 'org.springframework.kafka:spring-kafka'
    testImplementation 'org.springframework.kafka:spring-kafka-test'

    // Feign — deposit 호출용 클라이언트는 병합으로 사라지지만,
    // customer-service 등 남은 외부 호출에 계속 쓰인다.
    implementation 'org.springframework.cloud:spring-cloud-starter-openfeign:4.1.3'
    implementation 'io.github.openfeign:feign-hc5'

    // Flyway — deposit / payment 두 스키마를 location 분리로 관리
    implementation 'org.flywaydb:flyway-core'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'

    testImplementation 'org.springframework.security:spring-security-test'
}

// Windows Docker Desktop 4.69+: docker-java v1.32 API 요청에 400 반환.
// 로컬 우회: WSL2에서 Python TCP 프록시를 기동한 뒤 CORE_BANKING_TEST_DOCKER_HOST 지정.
tasks.withType(Test).configureEach {
    def overrideHost = System.getenv("CORE_BANKING_TEST_DOCKER_HOST")
            ?: System.getProperty("CORE_BANKING_TEST_DOCKER_HOST")
    if (overrideHost) {
        environment 'DOCKER_HOST', overrideHost
        systemProperty 'DOCKER_HOST', overrideHost
    }
}
