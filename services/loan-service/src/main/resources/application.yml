server:
  port: ${LOAN_APP_PORT:8083}

spring:
  application:
    name: loan-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  flyway:
    # advisory 마이그레이션(db/advisory-migration)은 버전대(V20~)가 loan 과 겹쳐
    # AdvisoryFlywayConfig 가 전용 이력 테이블로 별도 실행한다. 여기엔 loan 것만.
    locations: classpath:db/migration
    # V2.1(dot 버전)은 V3 이후가 이미 적용된 기존 DB에 뒤늦게 추가됐다.
    # out-of-order 가 false(기본)면 "Detected resolved migration not applied
    # to database: 2.1" 로 기동 실패하므로, 늦게 도착한 하위 버전 적용을 허용한다.
    out-of-order: true
  datasource:
    url: jdbc:postgresql://${LOAN_DB_HOST:localhost}:${LOAN_DB_PORT:5434}/${LOAN_DB_NAME:loan_db}
    username: ${LOAN_DB_USER:loan}
    password: ${LOAN_DB_PASSWORD:loan}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 20MB

  batch:
    job:
      enabled: false        # 부팅 시 자동 실행 방지
    jdbc:
      initialize-schema: never  # Flyway로 관리

# 공통 계좌 DB (common_db) — Phase 1: loan-service 채택. CommonDataSourceConfig 가 바인딩.
common:
  datasource:
    url: jdbc:postgresql://${COMMON_DB_HOST:localhost}:${COMMON_DB_PORT:5438}/${COMMON_DB_NAME:common_db}
    username: ${COMMON_DB_USER:common}
    password: ${COMMON_DB_PASSWORD:common}
    driver-class-name: org.postgresql.Driver

# 대출 도메인 전용 설정
loan:
  document:
    storage:
      # filesystem(기본) | s3
      # 다중 인스턴스 배포에서는 s3 여야 한다 — filesystem 은 인스턴스마다 저장소가 갈라져
      # 업로드를 받지 않은 노드로 다운로드 요청이 가면 실패한다.
      # 기본이 filesystem 인 이유: compose 의 MinIO 가 profiles:["doc"] 라 기본 스택에 없다.
      type: "${LOAN_DOCUMENT_STORAGE_TYPE:filesystem}"

      # [filesystem] 원본 보관 경로. 비우면 임시 디렉터리(로컬/테스트 전용).
      # 컨테이너에서는 반드시 영속 볼륨을 가리켜야 한다 — 임시 디렉터리는 재기동 시 사라져
      # 업로드된 서류의 다운로드가 조용히 실패한다.
      dir: "${LOAN_DOCUMENT_STORAGE_DIR:}"

      # [s3] MinIO/S3 접속 정보. type=s3 일 때만 쓰인다.
      endpoint: "${STORAGE_ENDPOINT:http://localhost:9000}"
      access-key: "${STORAGE_ACCESS_KEY:minioadmin}"
      secret-key: "${STORAGE_SECRET_KEY:minioadmin}"
      region: "${STORAGE_REGION:us-east-1}"
      bucket: "${LOAN_DOCUMENT_BUCKET:loan-documents}"
  batch:
    eod-cron: "${LOAN_EOD_CRON:0 0 1 * * *}"  # 기본 새벽 1시 KST
    eom-cron: "${LOAN_EOM_CRON:0 0 3 1 * *}"  # 기본 매월 1일 03:00 KST
    calendar-seed-cron: "${LOAN_CALENDAR_SEED_CRON:0 0 4 1 12 *}"  # 기본 매년 12월 1일 04:00 KST
  # 외부 신용평가(가심사) 엔진 어댑터 선택
  #   mock — MockCreditScoreEngine (외부 호출 없음, 자체 룰)
  #   http — HttpCreditScoreEngine (외부 신용평가사 HTTP API 호출)
  credit-score:
    engine:
      type: ${CREDIT_SCORE_ENGINE_TYPE:mock}
      http:
        url: ${CREDIT_SCORE_ENGINE_URL:http://localhost:9999}
        api-key: ${CREDIT_SCORE_ENGINE_API_KEY:}
  # IFRS9 ECL 산정 엔진 어댑터
  #   mock — MockEclEngine (외부 없이 단순 PD/LGD 룰)
  #   http — HttpEclEngine (외부 리스크 엔진 — 후속)
  ecl:
    engine:
      type: ${LOAN_ECL_ENGINE_TYPE:mock}

auto-review:
  enabled: ${AUTO_REVIEW_ENABLED:true}
  # 8089 다. 오래 8086 으로 적혀 있었는데 그 포트에서 듣는 것이 없어 자동심사 호출이
  # 늘 실패했다 — compose 에 AUTO_REVIEW_BASE_URL override 도 없었다.
  base-url: ${AUTO_REVIEW_BASE_URL:http://auto-loan-review:8089}
  internal-token: ${AUTO_REVIEW_INTERNAL_TOKEN:local-internal-token}
  connect-timeout-ms: ${AUTO_REVIEW_CONNECT_TIMEOUT_MS:5000}
  read-timeout-ms: ${AUTO_REVIEW_READ_TIMEOUT_MS:30000}

crypto:
  # AES-256 키 (32바이트 Base64). 반드시 CRYPTO_KEY_BASE64 환경변수로 주입해야 함.
  # 기본값 없음: 미주입 시 부팅 실패 (fail-fast). 로컬 개발값은 application-local.yml 참조.
  key-base64: ${CRYPTO_KEY_BASE64}

payment:
  # 수납/집행 시스템 계좌는 common_db.common_account(account_nickname=LOAN_COLLECTION/LOAN_DISBURSEMENT)로 이관.
  # SystemAccountProvider 가 조회한다. 여기엔 payment-service 엔드포인트만.
  url: ${PAYMENT_SERVICE_URL:http://localhost:8080}
  # 여신의 서비스 자격증명. core-banking 이 이 값의 SHA-256 으로 신원을 찾는다
  # (service_principal.credential_hash — db-payment V32).
  #
  # 서비스마다 자기 값을 갖는다. 공유 토큰을 쓰면 신원이 하나가 되어, 그 토큰을
  # 가진 무엇이든 여신을 사칭할 수 있다.
  credential: ${LOAN_SERVICE_CREDENTIAL:dev-secret-loan-service-credential}
  collection:
    bank-code: ${PAYMENT_COLLECTION_BANK_CODE:088}
    account-no: ${PAYMENT_COLLECTION_ACCOUNT_NO:00000000000}
    holder-name: ${PAYMENT_COLLECTION_HOLDER_NAME:한국은행}
  disbursement:
    account-id: ${PAYMENT_DISBURSEMENT_ACCOUNT_ID:BANK_DISBURSE_001}

doc-agent:
  # doc-agent 는 8087 에서 listen 한다(서비스 server.port=8087, compose 8087:8087).
  # 도커 네트워크 기본값은 http://doc-agent:8087, 호스트 실행 시 DOC_AGENT_BASE_URL=http://localhost:8087 로 오버라이드.
  # doc-agent 미기동(compose profile "doc" 미활성) 시에도 서류 업로드는 검증 보류(PENDING)로 강등되어 성공한다.
  base-url: ${DOC_AGENT_BASE_URL:http://doc-agent:8087}

internal:
  token: ${INTERNAL_SERVICE_TOKEN:local-internal-token}

# ---- Phase E E3-8: 합성 케이스 seed (기본 비활성 — 개발 환경 1회 실행용) ----
ai:
  case-seed:
    enabled: ${AI_CASE_SEED_ENABLED:false}
    count: ${AI_CASE_SEED_COUNT:10000}
    batch-size: 500
    aggregate-base: 9000000  # rev_id 충돌 방지 고정 오프셋

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99
    tags:
      application: ${spring.application.name}

# ---- OpenAPI / Swagger UI ----
# 접속: http://localhost:${LOAN_APP_PORT}/swagger-ui.html
springdoc:
  # 스펙의 키 순서를 알파벳순으로 고정한다.
  # 기본값은 순서가 보장되지 않아 같은 코드에서도 매번 다른 순서로 나온다.
  # 프론트 타입을 이 스펙에서 생성하고(web/scripts/generate-api-types.sh) CI 가
  # 재생성 후 diff 로 드리프트를 잡으므로, 순서가 흔들리면 검사가 매번 실패한다.
  writer-with-order-by-keys: true
  api-docs:
    path: /v3/api-docs
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true
  packages-to-scan: com.bank.loan
  default-produces-media-type: application/json


# ---- Advisory / AI Gateway ----
advisory:
  # advisory.service.* 를 걷어냈다. 별도 프로세스로 부르던 설정인데, 그 프로세스는
  # 빌드에 포함된 적이 없어 호출이 언제나 실패했다(실패는 빈 목록으로 삼켜졌다).
  # 지금은 같은 프로세스라 주소가 필요 없다.
  ai-gateway:
    base-url: ${AIGATEWAY_BASE_URL:http://localhost:8088}
    timeout-ms: ${AIGATEWAY_TIMEOUT_MS:35000}
    connect-timeout-ms: ${AIGATEWAY_CONNECT_TIMEOUT_MS:3000}
  rag:
    embed:
      provider: ${ADVISORY_RAG_EMBED_PROVIDER:openai}
      model: ${ADVISORY_RAG_EMBED_MODEL:text-embedding-3-small}
      dimension: ${ADVISORY_RAG_EMBED_DIMENSION:1536}
      openai:
        base-url: ${ADVISORY_OPENAI_BASE_URL:https://api.openai.com}
        api-key: ${OPENAI_API_KEY:}
        connect-timeout-ms: ${ADVISORY_OPENAI_CONNECT_TIMEOUT_MS:2000}
        read-timeout-ms: ${ADVISORY_OPENAI_READ_TIMEOUT_MS:10000}
        max-attempts: ${ADVISORY_OPENAI_MAX_ATTEMPTS:3}
        retry-backoff-ms: ${ADVISORY_OPENAI_RETRY_BACKOFF_MS:300}
    cache:
      ttl-hours: ${ADVISORY_RAG_CACHE_TTL_HOURS:6}

ai-service:
  base-url: ${AI_SERVICE_BASE_URL:http://localhost:8086}

logging:
  file:
    name: ${LOG_DIR:C:/logs/internet-banking}/loan-service.log
  level:
    root: INFO
