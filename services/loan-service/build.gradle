// loan-service: 의존성/플러그인은 루트 build.gradle 의 subprojects 블록에서 일괄 관리

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-batch'
    // 신청서류 원본 보관(MinIO/S3). doc-agent 와 같은 버전을 쓴다.
    implementation 'software.amazon.awssdk:s3:2.26.12'
    testImplementation 'org.springframework.batch:spring-batch-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.wiremock:wiremock-standalone:3.9.1'
}

// advisory-service 소스를 같은 JVM에서 컴파일 (com.bank.loan.advisory.* 패키지)
// advisory-service는 agents/로 이동됨 → 경로: services/loan-service 기준 ../../agents/advisory-service
sourceSets {
    main {
        java {
            srcDirs += ['../../agents/advisory-service/src/main/java']
        }
        resources {
            srcDirs += ['../../agents/advisory-service/src/main/resources']
        }
    }
    test {
        java {
            srcDirs += ['../../agents/advisory-service/src/test/java']
        }
    }
}
