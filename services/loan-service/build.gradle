// loan-service: 의존성/플러그인은 루트 build.gradle 의 subprojects 블록에서 일괄 관리

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-batch'
    // 신청서류 원본 보관(MinIO/S3). doc-agent 와 같은 버전을 쓴다.
    implementation 'software.amazon.awssdk:s3:2.26.12'
    testImplementation 'org.springframework.batch:spring-batch-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.wiremock:wiremock-standalone:3.9.1'
}

// advisory 코드(com.bank.loan.advisory.*)는 loan-service 소스 안에 있다.
// 예전에는 agents/advisory-service 를 srcDirs 로 끌어다 컴파일했는데, 그 디렉터리는
// 이제 비어 있다(파일 0개). git 은 빈 디렉터리를 추적하지 않으므로 새 체크아웃에는
// 아예 없고, Dockerfile 의 COPY 가 거기서 실패했다 — 깨끗한 클론에서 이미지가
// 빌드되지 않았다.
