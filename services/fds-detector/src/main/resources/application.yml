spring:
  application:
    name: fds-detector

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      # 별도 컨슈머 그룹. 결제계·회계계가 쓰는 그룹과 겹치면 서로 이벤트를 나눠 갖게 되어
      # 양쪽 다 일부만 보게 된다.
      group-id: ${FDS_CONSUMER_GROUP:fds-detector}
      auto-offset-reset: latest
      # 수동 커밋. 처리 결과와 무관하게 한 번만 ack 한다(PaymentCompletedConsumer 참조).
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: manual

server:
  port: ${FDS_DETECTOR_PORT:8092}

fds:
  kafka:
    topic: ${FDS_TOPIC:payment.completed}
    consumer-group: ${FDS_CONSUMER_GROUP:fds-detector}
  core-banking:
    base-url: ${CORE_BANKING_URL:http://core-banking:8082}
    # 서비스 자격증명. 환경변수 이름을 여기 명시하는 이유는, 프로퍼티 이름에
    # 하이픈이 있어 relaxed binding 이 FDS_COREBANKING_CREDENTIAL 을 찾기 때문이다.
    # compose 가 주는 FDS_CORE_BANKING_CREDENTIAL 과 어긋나면 조용히 기본값으로
    # 떨어져, 운영에 개발용 자격증명이 실린 채로 뜬다.
    credential: ${FDS_CORE_BANKING_CREDENTIAL:dev-secret-fds-detector-credential}
    # 타임아웃을 반드시 건다. 결제계가 응답만 안 하고 연결은 살아 있으면
    # 컨슈머 스레드가 묶여 탐지가 통째로 멈춘다.
    timeout-ms: ${FDS_ENRICH_TIMEOUT_MS:3000}
  dedupe:
    # 중복 방지 보관 기간. 속도·분할 룰이 보는 시간창보다 넉넉해야 한다.
    ttl-minutes: ${FDS_DEDUPE_TTL_MINUTES:180}
  risk:
    # 사후 탐지가 올려 둔 위험 표시의 유효 기간. 영구 낙인이 아니라
    # 한동안 조심하자는 표시다.
    elevated-ttl-hours: ${FDS_RISK_TTL_HOURS:24}
  velocity:
    window-minutes: ${FDS_VELOCITY_WINDOW_MINUTES:10}
  rule:
    # 임시 기준이다. 고객 프로파일(평소 금액 대비 편차)이 들어오면 대체한다 —
    # "1천만원 넘으면 의심" 은 실무에서 잘 쓰지 않는다. 평소 5만원 쓰던 사람의
    # 300만원이 훨씬 강한 신호다.
    high-amount: ${FDS_HIGH_AMOUNT:10000000}
    velocity-threshold: ${FDS_VELOCITY_THRESHOLD:5}
    # 1일 누적 보고 기준. 규제가 요구하는 항목이라 점수와 무관하게 사람에게 간다 —
    # "모델이 낮게 봤으니 통과" 가 성립하지 않는 종류다.
    # 실제 기준 금액은 현행 규정으로 확인해 넣을 것. 아래는 데모용 값이다.
    daily-cumulative-threshold: ${FDS_DAILY_CUMULATIVE_THRESHOLD:20000000}
    # 심야 구간(KST). 업무 기준 시각은 한국 시간이라 UTC 로 재면 9시간이 밀려
    # 한국의 아침이 심야로 잡힌다.
    night-from-hour: ${FDS_NIGHT_FROM_HOUR:0}
    night-to-hour: ${FDS_NIGHT_TO_HOUR:6}
  investigation:
    # 조사 에이전트(FastAPI 사이드카). 사건을 넘기고 결과는 기다리지 않는다 —
    # 조사는 건당 수 초~수십 초라 기다리면 스트림이 밀린다.
    enabled: ${FDS_INVESTIGATION_ENABLED:true}
    base-url: ${FRAUD_AGENT_URL:http://fraud-agent:8090}
    timeout-ms: ${FDS_INVESTIGATION_TIMEOUT_MS:5000}
    # 사이드카와 나눠 갖는 시크릿. 사이드카의 FRAUD_DISPATCH_SHARED_SECRET 과 같아야
    # 한다. 없으면 인계가 전부 403 으로 되튀어 조사 큐가 비어 있게 된다.
    shared-secret: ${FRAUD_DISPATCH_SHARED_SECRET:}
  receiver:
    # 수취인 이력 보관 기간. 너무 짧으면 단골 수취인도 매번 신규로 잡혀 오탐이 는다.
    history-days: ${FDS_RECEIVER_HISTORY_DAYS:180}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    export:
      prometheus:
        enabled: true
    # application 라벨이 없으면 application 으로 묶는 대시보드 패널에서 이 서비스만
    # 통째로 빠진다 — 그래프가 비는 게 아니라 아예 안 나온다.
    tags:
      application: fds-detector
      environment: ${SPRING_PROFILES_ACTIVE:local}
