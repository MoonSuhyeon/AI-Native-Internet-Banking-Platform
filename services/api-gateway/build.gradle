plugins {
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:2023.0.3"
    }
}

dependencies {
    implementation project(':common')

    // Spring Cloud Gateway (WebFlux 기반 — spring-boot-starter-web 과 공존 불가)
    implementation 'org.springframework.cloud:spring-cloud-starter-gateway'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis-reactive'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'

    // JWT 파싱 (JwtProvider 런타임 의존성 — common 은 compileOnly 로만 선언)
    implementation 'io.jsonwebtoken:jjwt-api:0.12.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.5'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'io.projectreactor:reactor-test'
}

// SidecarExposureTest 는 레포 루트의 docker-compose.yml 을 읽는다. 선언하지 않으면
// Gradle 이 그 파일 변경을 모르고 테스트를 UP-TO-DATE 로 건너뛴다 — 사이드카 포트를
// 다시 열어도 이전 성공 결과가 재사용되어 **조용히 통과**한다.
//
// 실제로 이 함정을 확인했다. 포트를 되살리고 test 를 돌리니 2초 만에 BUILD SUCCESSFUL
// 이 나왔고, --rerun-tasks 를 붙여서야 실패했다.
tasks.named('test') {
    inputs.file(rootProject.file('docker-compose.yml'))
            .withPropertyName('dockerComposeFile')
            .withPathSensitivity(PathSensitivity.RELATIVE)
}
