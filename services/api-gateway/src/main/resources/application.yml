server:
  port: ${GATEWAY_PORT:8080}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOriginPatterns:
              - "http://localhost:3000"
              - "http://localhost:3001"
              - "https://axfulbank.store"
              - "https://*.vercel.app"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true
            maxAge: 3600
      # [증상 정정] 다운스트림(customer/loan/payment/doc-agent/deposit 등)이
      # 각자 자체 CORS 헤더를 붙여 Access-Control-Allow-Origin 이 중복되면
      # 브라우저가 다중값을 거부한다. 중복 헤더를 유일값으로 병합해 차단을 막는다.
      #
      # RETAIN_UNIQUE 는 값이 동일할 때만 안전하게 1개로 합친다. 현재 각 서비스의
      # allowedOrigins 는 게이트웨이와 동일(localhost:3000/3001)하며, deposit 만
      # allowedOriginPatterns("localhost:*") 로 더 넓으나 위 origin 들에 대해선
      # 동일한 구체값을 반영하므로 병합이 안전하다(2026-06 검증).
      #
      # Allow-Origin/Credentials 외에 Allow-Methods/Allow-Headers/Max-Age 도
      # OPTIONS preflight 응답에서 동일하게 중복되므로 함께 병합한다(브라우저는
      # 관대하나 일관성을 위해 정리).
      #
      # TODO(기술부채): 근본 해법은 CORS 를 게이트웨이에서 단독 처리하고 각 서비스의
      # SecurityConfig/CorsConfig 의 CORS 설정을 제거하는 것이다. 서비스가 추가될
      # 때마다 동일한 이중부착 패턴이 반복되므로, 각 도메인 담당과 협의해 후속 정리 권장.
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials Access-Control-Allow-Methods Access-Control-Allow-Headers Access-Control-Max-Age, RETAIN_UNIQUE
      routes:
        # 인증 공개 엔드포인트 (JWT 검증 없음)
        - id: auth-public
          uri: http://${CUSTOMER_SERVICE_HOST:localhost}:${CUSTOMER_SERVICE_PORT:8081}
          predicates:
            - Path=/api/v1/auth/**
          filters:
            # 인증 시도는 계정당 실패 횟수와 별도로 IP 단위로 제한한다. 값은 운영의
            # `GATEWAY_AUTH_*` 환경 설정으로만 결정한다(코드에 임의 정책값을 두지 않는다).
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@rateLimitKeyResolver}"
                redis-rate-limiter.replenishRate: ${GATEWAY_AUTH_REPLENISH_RATE}
                redis-rate-limiter.burstCapacity: ${GATEWAY_AUTH_BURST_CAPACITY}

        # 휴대폰 본인인증 (가입 단계 — JWT 없이 공개)
        - id: mobile-auth-public
          uri: http://${CUSTOMER_SERVICE_HOST:localhost}:${CUSTOMER_SERVICE_PORT:8081}
          predicates:
            - Path=/api/v1/mobile-auth/**

        # 고객 도메인 (JWT 필요)
        #
        # /api/v1/banking/** 이 빠져 있었다. 출금계좌 관리 화면이 그 경로를 부르는데
        # 라우트가 없어 게이트웨이에서 404 였다 — 컨트롤러도 화면도 멀쩡했고, 목록이
        # 늘 비어 보일 뿐이었다. 즐겨찾기(자주쓰는계좌·단축이체)가 같은 접두사를 쓴다.
        #
        # /api/v1/notifications/** 는 입금통보 신청·알림함이다. 대출 쪽의
        # /api/notifications/** 와 이름이 비슷하지만 v1 유무로 갈리는 다른 경로다.
        #
        # /api/v1/branches/** 는 영업점 조회와 지점 상담 예약이다.
        - id: customer
          uri: http://${CUSTOMER_SERVICE_HOST:localhost}:${CUSTOMER_SERVICE_PORT:8081}
          predicates:
            - Path=/api/v1/customers/**,/api/v1/banking/**,/api/v1/notifications/**,/api/v1/branches/**,/api/v1/cert/**
          filters:
            # 고객 조회·인증서 경로는 인증된 고객별 한도를 쓴다. 수치는 채널별 정상
            # 트래픽과 부하 시험 결과를 근거로 운영 환경에서 주입한다.
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@rateLimitKeyResolver}"
                redis-rate-limiter.replenishRate: ${GATEWAY_CUSTOMER_REPLENISH_RATE}
                redis-rate-limiter.burstCapacity: ${GATEWAY_CUSTOMER_BURST_CAPACITY}

        # 직원용 내부 API (JWT 필요 — customer-service가 X-User-Role로 역할 게이팅)
        # customer 소유 하위경로만 한정 라우팅 → 타 서비스가 미래에 /api/v1/internal/* 를 써도 충돌 없음.
        # (타 서비스의 internal API는 /api/internal/...(v1 없음)·서비스 간 호출이라 본 라우트와 무관)
        - id: customer-internal
          uri: http://${CUSTOMER_SERVICE_HOST:localhost}:${CUSTOMER_SERVICE_PORT:8081}
          predicates:
            - Path=/api/v1/internal/customers/**,/api/v1/internal/party/**,/api/v1/internal/compliance/**,/api/v1/internal/fds/**

        # 예금·수신 도메인 (JWT 필요)
        # deposit / payment 는 병합 후 같은 서비스(core-banking)로 간다.
        # 라우트를 하나로 합치지 않은 것은 의도적이다 — 경로 목록이 도메인별로 남아 있어야
        # 어떤 API 가 어느 도메인 것인지 읽힌다. 대상 호스트만 같다.
        - id: deposit
          uri: http://${DEPOSIT_SERVICE_HOST:localhost}:${DEPOSIT_SERVICE_PORT:8082}
          predicates:
            - Path=/api/v1/accounts/**,/api/products/**,/api/accounts/**,/api/contracts/**,/api/transactions/**,/api/interests/**,/api/join-targets/**,/api/payment-schedules/**,/api/departments/**

        # 대출 도메인 (JWT 필요)
        #
        # /api/advisory/** 가 포함된 이유: 어드바이저리는 별도 서비스가 아니라
        # loan-service 안에 있다. 예전에는 이 경로가 라우트에 없어 브라우저가 직접
        # 부를 수 있었고, 권한 검사가 22곳 있었는데도 전부 호출자가 스스로 적은
        # X-Actor-Role 헤더를 읽고 있었다. 지금은 게이트웨이가 지우고 덮어쓰는
        # X-User-Role 로 판정한다.
        #
        # /api/internal/advisory/** 도 넣는다. 규약상 v1 없는 internal 은 서비스 간
        # 호출이지만, 이 경로에는 사람이 쓰는 관리 API(정책문서 인입·인덱스 재구축)가
        # 섞여 있고 어드민 화면이 그것을 부른다. 라우트가 없으면 브라우저가 직접 부르게
        # 되고, 그러면 역할 검사가 읽을 X-User-Role 이 붙지 않아 전부 거절된다.
        #
        # 라우트를 더해도 review-ai-gateway 의 도구 호출은 그대로다 — 그쪽은 컨테이너
        # 주소로 직접 부르고, 도구 조회에는 역할 가드가 없다.
        - id: loan
          uri: http://${LOAN_SERVICE_HOST:localhost}:${LOAN_SERVICE_PORT:8083}
          predicates:
            - Path=/api/loan-applications/**,/api/loan-products/**,/api/loan-contracts/**,/api/collaterals/**,/api/credit-info-reports/**,/api/credit-score/**,/api/loan-certificates/**,/api/loan-documents/**,/api/loan-reviews/**,/api/loans/**,/api/business-calendar/**,/api/notifications/**,/api/status-history/**,/api/admin/loan-contracts/**,/api/audit/**,/api/break-glass/**,/api/advisory/**,/api/internal/advisory/**,/api/internal/eod/**
          filters:
            # 여신 심사·신용정보는 고객/직원별 한도를 쓴다. 값은 심사 SLA와 다운스트림
            # 용량을 근거로 배포 설정에서 관리한다.
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@rateLimitKeyResolver}"
                redis-rate-limiter.replenishRate: ${GATEWAY_LOAN_REPLENISH_RATE}
                redis-rate-limiter.burstCapacity: ${GATEWAY_LOAN_BURST_CAPACITY}

        # 지급·이체 도메인 (JWT 필요)
        #
        # 기본 포트가 8084 였다. payment-service 가 별도 서비스이던 시절의 값이다.
        # 지금은 core-banking(8082) 안에 있어, 로컬 bootRun 에서는 8084 에 아무도
        # 없어 502 가 났다. Docker 는 PAYMENT_SERVICE_PORT=8082 를 명시해 주고 있어
        # 컨테이너로 띄우면 멀쩡했다 — 로컬에서만 조용히 깨지는 종류다.
        - id: payment
          uri: http://${PAYMENT_SERVICE_HOST:localhost}:${PAYMENT_SERVICE_PORT:8082}
          predicates:
            - Path=/api/v1/payments/**

        # 서류 심사 에이전트 (JWT 필요)
        #
        # 심사 결정(/review)은 자동 판정을 사람이 뒤집는 지점이고, 그 기록이 곧
        # AI 채택률 지표의 근거다. 그런데 reviewer_id 를 요청 body 로 받고 있어서
        # 아무 이름이나 적을 수 있었다 — 지표는 "사람이 이만큼 뒤집었다" 고 말하는데
        # 그 사람이 누구인지는 아무도 확인하지 않는 상태였다.
        #
        # 법적보존(legal-hold)도 같다. 삭제를 막는 규제 통제인데 아무나 끌 수 있었다.
        #
        # 경로 재작성이 없는 이유: 이 서비스는 이미 /api/documents 로 받는다.
        - id: doc-agent
          uri: http://${DOC_AGENT_HOST:localhost}:${DOC_AGENT_PORT:8087}
          predicates:
            - Path=/api/documents/**
          filters:
            - AddRequestHeader=X-Gateway-Auth, ${DOC_AGENT_GATEWAY_SHARED_SECRET:not-configured}

        # 고객용 상담·챗봇 (JWT 필요)
        #
        # 이 라우트가 없으면 브라우저가 상담 서비스를 직접 부르고, 그러면 고객 신원이
        # 요청 body 의 customer_no 로만 정해진다. 남의 번호를 적으면 그 사람의
        # 상품·계약·현금흐름이 나오고, /chatbot/transfer 로는 **그 사람 계좌에서
        # 돈이 나간다** — 소유권 검사가 있었지만 공격자가 적은 값과 대조하고 있었다.
        #
        # 게이트웨이를 거치면 JwtAuthenticationFilter 가 클라이언트발 X-Customer-Id 를
        # 지우고 검증된 클레임으로 덮어쓴다. 상담 서비스는 그 헤더만 믿는다.
        - id: consultation-customer
          uri: http://${CONSULTATION_SERVICE_HOST:localhost}:${CONSULTATION_SERVICE_PORT:8087}
          predicates:
            - Path=/api/v1/consultation/**
          filters:
            - RewritePath=/api/v1/consultation/(?<segment>.*), /$\{segment}
            - AddRequestHeader=X-Gateway-Auth, ${CONSULTATION_GATEWAY_SHARED_SECRET:not-configured}

        # ── X-Gateway-Auth 기본값에 대하여 ────────────────────────────────
        #
        # 빈 문자열을 쓰면 게이트웨이가 아예 뜨지 않는다. Spring Cloud Gateway 의
        # AddRequestHeader 는 값이 비면 "must not be empty" 로 바인딩을 거부하고
        # ApplicationContext 가 죽는다. 시크릿 미설정이 기본값이므로, 그대로 두면
        # 아무 설정 없이 띄웠을 때 반드시 게이트웨이가 못 뜬다.
        #
        # 그래서 비어 있지 않은 표식을 넣는다. 사이드카는 자기 시크릿이 비어 있으면
        # 무엇이 오든 믿지 않으므로(fail-closed) 이 값으로 통과하지 않는다.
        #
        # 직원용 상담 조회 (JWT 필요)
        #
        # 조회 대상이 고객 개인정보·계좌·거래·상담이력이라 "누가 열람했는가"가 감사의
        # 핵심이다. 그런데 지금까지 직원 ID 는 화면의 자유 입력값이 body 로 실려 왔다 —
        # 아무 직원 번호나 적으면 그 사람 앞으로 열람 기록이 쌓였다.
        #
        # 이 라우트를 거치면 JwtAuthenticationFilter 가 클라이언트발 X-Employee-Id 를
        # 제거한 뒤 JWT 의 empId 클레임으로 덮어쓴다. 상담 서비스는 그 헤더만 믿고
        # body 의 staff_id 는 쓰지 않는다.
        #
        # ⚠ fraud-agent 와 같은 한계다. 상담 서비스가 8087 로 직접 열려 있으면
        #   게이트웨이를 우회하면 그만이라, 네트워크 격리와 한 세트여야 완결된다.
        #   공유 시크릿은 그때까지의 최소 방어선이다.
        - id: consultation-staff
          uri: http://${CONSULTATION_SERVICE_HOST:localhost}:${CONSULTATION_SERVICE_PORT:8087}
          predicates:
            - Path=/api/v1/internal/consultation/**
          filters:
            # 상담 서비스는 접두어 없이 /chatbot/... 로 받는다.
            #   /api/v1/internal/consultation/chatbot/features/X/execute
            #     → /chatbot/features/X/execute
            - RewritePath=/api/v1/internal/consultation/(?<segment>.*), /$\{segment}
            - AddRequestHeader=X-Gateway-Auth, ${CONSULTATION_GATEWAY_SHARED_SECRET:not-configured}

        # 이상거래 조사 에이전트 (JWT 필요)
        #
        # 이 라우트가 있어야 하는 이유는 단순 프록시가 아니다. 조사 승인(/approve)은
        # 지급정지·STR 을 발동시키는 지점이라 "누가 승인했는가"가 감사의 핵심인데,
        # 사이드카를 브라우저가 직접 부르면 그 신원을 검증할 방법이 없다.
        # JwtAuthenticationFilter 가 클라이언트발 X-Employee-Id·X-User-Role 을
        # 제거한 뒤 JWT 클레임으로 주입하므로, 이 경로로 들어온 요청만 신원이 확실하다.
        #
        # ⚠ 이 라우트만으로는 부족하다. 사이드카가 8090 으로 직접 열려 있으면
        #   게이트웨이를 우회하면 그만이다. 네트워크 격리와 반드시 한 세트다.
        - id: fraud-agent
          uri: http://${FRAUD_AGENT_HOST:localhost}:${FRAUD_AGENT_PORT:8090}
          predicates:
            - Path=/api/v1/internal/fraud/**
          filters:
            # 사이드카는 /api/cases·/api/investigate·/api/approve 로 받는다.
            # StripPrefix 로는 /api 접두어를 되살릴 수 없어 경로를 재작성한다.
            #   /api/v1/internal/fraud/investigate → /api/investigate
            - RewritePath=/api/v1/internal/fraud/(?<segment>.*), /api/$\{segment}
            # 게이트웨이를 거쳤다는 증거. 사이드카는 이 값이 맞을 때만 신원 헤더를 믿는다.
            - AddRequestHeader=X-Gateway-Auth, ${FRAUD_GATEWAY_SHARED_SECRET:not-configured}

        # 이상거래 안내 다듬기 — **고객 본인**이 부른다 (JWT 필요)
        #
        # 위 fraud-agent 라우트와 같은 사이드카지만 경로를 나눈 이유가 있다. 그쪽은
        # /api/v1/internal/** 이라 직원 전용이고, 이 경로는 이체가 막힌 고객이
        # 자기 화면에서 부른다. 한 라우트로 합치면 조사 큐(/api/cases)와 승인
        # (/api/approve)까지 고객 토큰으로 열린다.
        #
        # 사이드카는 X-Gateway-Auth 가 맞을 때만 X-Customer-Id 를 믿는다. 이게 없으면
        # 아무나 남의 고객번호를 적어 그 사람의 연령대를 알아낼 수 있다.
        - id: fraud-agent-guidance
          uri: http://${FRAUD_AGENT_HOST:localhost}:${FRAUD_AGENT_PORT:8090}
          predicates:
            - Path=/api/v1/fraud/guidance
          filters:
            - SetPath=/api/guidance
            - AddRequestHeader=X-Gateway-Auth, ${FRAUD_GATEWAY_SHARED_SECRET:not-configured}

        # 상담 요청 — 이체가 막힌 고객이 케이스를 연다 (JWT 필요)
        - id: fraud-agent-consult
          uri: http://${FRAUD_AGENT_HOST:localhost}:${FRAUD_AGENT_PORT:8090}
          predicates:
            - Path=/api/v1/fraud/consult
          filters:
            - SetPath=/api/consult
            - AddRequestHeader=X-Gateway-Auth, ${FRAUD_GATEWAY_SHARED_SECRET:not-configured}

        # 목표·지출 에이전트 (JWT 필요)
        #
        # 프론트의 BFF 프록시가 NEXT_PUBLIC_AI_API_URL 기본값 8086 으로 이 에이전트를
        # 부르고 있었는데, 그 포트는 아무도 듣지 않는다 — goal-agent 는 compose 에 없고
        # 호스트에서 돈다. 지출 분석 화면이 조용히 실패하고 있었다.
        #
        # 게이트웨이 경로를 만들어 그 우회로를 없앤다. 고객 지출 내역을 다루므로
        # 신원이 검증된 요청만 닿아야 한다.
        #
        # ⚠ goal-agent 가 호스트에서 도는 것 자체가 배치가 아니라 개발 편의다.
        #   컨테이너로 올리고 망을 나누는 것이 정상화이며, 그때 uri 만 바뀐다.
        #   (docs/decisions/security-zone-topology.md 의 "호스트 연동" 항목)
        - id: goal-agent
          uri: http://${GOAL_AGENT_HOST:host.docker.internal}:${GOAL_AGENT_PORT:8000}
          predicates:
            - Path=/api/v1/agent/**
          filters:
            # 에이전트는 /agent/spending/chat 로 받는다.
            #   /api/v1/agent/spending/chat → /agent/spending/chat
            - RewritePath=/api/v1/agent/(?<segment>.*), /agent/$\{segment}

        # 자동심사 시뮬레이터는 gateway가 검증한 역할과 내부 토큰을 모두 전달한다.
        - id: auto-loan-review-admin
          uri: http://${AUTO_LOAN_REVIEW_HOST:localhost}:${AUTO_LOAN_REVIEW_PORT:8086}
          predicates:
            - Path=/api/ai/auto-review/**
          filters:
            - AddRequestHeader=X-Internal-Token, ${AUTO_LOAN_REVIEW_INTERNAL_TOKEN:not-configured}
            # 고비용 추론 경로의 한도는 모델/LLM 공급자 쿼터를 근거로 운영에서 주입한다.
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@rateLimitKeyResolver}"
                redis-rate-limiter.replenishRate: ${GATEWAY_AUTO_REVIEW_REPLENISH_RATE}
                redis-rate-limiter.burstCapacity: ${GATEWAY_AUTO_REVIEW_BURST_CAPACITY}

jwt:
  secret: ${JWT_SECRET:dev-secret-key-please-change-in-production-min-32-chars-long}
  access-token-validity: 600000    # 10분 (밀리초)
  refresh-token-validity: 3600000  # 1시간 (밀리초)

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99
    tags:
      application: ${spring.application.name}

logging:
  file:
    name: ${LOG_DIR:C:/logs/internet-banking}/api-gateway.log
  level:
    root: INFO
