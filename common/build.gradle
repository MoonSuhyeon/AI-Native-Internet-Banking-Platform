plugins {
    id 'java-library'
}

dependencies {
    api 'org.springframework.boot:spring-boot-starter:3.3.5'

    // Spring Boot 의존 자원은 서비스 모듈이 starter 로 가져오므로 compileOnly 노출
    compileOnly 'org.springframework.boot:spring-boot-starter-web:3.3.5'
    compileOnly 'org.springframework.boot:spring-boot-starter-data-jpa:3.3.5'
    compileOnly 'org.springframework.boot:spring-boot-starter-data-redis:3.3.5'
    compileOnly 'org.springframework.boot:spring-boot-starter-validation:3.3.5'

    // OpenAPI 어노테이션을 common 의 @Configuration 에서 참조하므로 compileOnly 로 노출
    compileOnly 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'

    // JWT 유틸(JwtProvider) 컴파일용. 런타임 구현체는 각 서비스가 제공
    compileOnly 'io.jsonwebtoken:jjwt-api:0.12.5'

    compileOnly 'org.projectlombok:lombok:1.18.34'
    annotationProcessor 'org.projectlombok:lombok:1.18.34'

    testImplementation 'org.springframework.boot:spring-boot-starter-test:3.3.5'
    testImplementation 'org.springframework.boot:spring-boot-starter-web:3.3.5'
    testImplementation 'io.jsonwebtoken:jjwt-api:0.12.5'
    testRuntimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.5'
    testRuntimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.5'
}

// ScrapeTargetConsistencyTest 는 레포 루트의 설정 파일 두 개를 읽는다.
// 기본적으로 Gradle 은 그 파일을 테스트 입력으로 모르기 때문에, compose 나 prometheus.yml 만
// 고치면 테스트를 UP-TO-DATE 로 건너뛴다 — 정작 검사해야 할 변경에서 안 도는 셈이다.
// 입력으로 등록해 두 파일이 바뀌면 다시 돌게 한다.
tasks.named('test') {
    inputs.file(rootProject.file('docker-compose.yml')).withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.file(rootProject.file('infra/prometheus/prometheus.yml')).withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.file(rootProject.file('infra/prometheus/alerts.yml')).withPathSensitivity(PathSensitivity.RELATIVE)
    // 선언하지 않으면 이 파일만 바뀌었을 때 테스트가 up-to-date 로 건너뛴다.
    inputs.file(rootProject.file('infra/prometheus/rules.yml')).withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.dir(rootProject.file('infra/grafana/provisioning/dashboards')).withPathSensitivity(PathSensitivity.RELATIVE)
}

// DockerBuildContextTest·ComposeNetworkReachabilityTest·ScrapeTargetConsistencyTest 는
// 레포 루트의 설정 파일들을 읽는다. 선언하지 않으면 Gradle 이 그 변경을 모르고 테스트를
// UP-TO-DATE 로 건너뛴다 — 지키라고 만든 검사가 조용히 안 도는 상태가 된다.
tasks.named('test') {
    inputs.file(rootProject.file('docker-compose.yml'))
            .withPropertyName('dockerComposeFile')
            .withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.file(rootProject.file('infra/prometheus/prometheus.yml'))
            .withPropertyName('prometheusConfig')
            .withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.files(rootProject.fileTree('.') {
        include '**/Dockerfile'
        include '**/build.gradle'
        include 'web/lib/*.ts'
        // 서버측 프록시. FrontendGatewayOnlyTest 가 여기도 읽는다 — 선언하지 않으면
        // 프록시를 서비스 직통으로 되돌려도 테스트가 UP-TO-DATE 로 안 돌아, 실제로
        // 그 변이가 통과했다.
        include 'web/app/api/**/route.ts'
        // 색 두 벌(ThemeTokenSyncTest). 선언하지 않으면 한쪽만 고쳐도 검사가
        // UP-TO-DATE 로 안 돌아, 어긋난 상태가 통과한다.
        include 'web/tailwind.config.ts'
        include 'web/lib/theme.ts'
        // 다온은행 화면(DaonPaletteIsolationTest).
        include 'web/app/other-bank/**/*.tsx'
        include 'web/components/other-bank/*.tsx'
        // 프론트가 부르는 경로 ↔ 게이트웨이 라우트 대조(GatewayRouteCoverageTest).
        // 화면 어디서든 새 /api 경로를 부를 수 있으므로 web 전체를 본다.
        include 'web/app/**/*.ts'
        include 'web/app/**/*.tsx'
        include 'web/components/**/*.tsx'
        include 'services/api-gateway/src/main/resources/application.yml'
        // API 명세 ↔ 컨트롤러 대조(ApiSpecFreshnessTest). 선언하지 않으면 컨트롤러를
        // 추가해도 검사가 UP-TO-DATE 로 안 돌아, 문서에 빠진 채로 통과한다.
        include 'docs/api-spec.md'
        include 'services/*/src/main/java/**/*Controller.java'
        include 'agents/*/src/main/java/**/*Controller.java'
        // 계획 문서 상태 줄(PlanStatusTest). 선언하지 않으면 계획서를 추가해도
        // 검사가 UP-TO-DATE 로 안 돌아, 상태 없는 문서가 통과한다.
        include 'docs/plan/*.md'
        // 개발 스크립트 ↔ Gradle 모듈 대조(DevScriptModuleTest).
        include 'scripts/*.ps1'
        include 'settings.gradle'
        // compose 가 요구하는 변수 ↔ 샘플 대조(EnvSampleCoverageTest).
        // 이 줄을 빠뜨려 변이 검증이 통과했다 — 이 레포에서 여섯 번째다.
        include '.env.sample'
        // 상단 대출 메뉴 ↔ 대출 사이드바 대조(LoanNavConsistencyTest).
        include 'web/components/layout/Header.tsx'
        include 'web/components/inquiry/LoanSidebar.tsx'
        // 프론트 라우트가 토큰을 스스로 만들지 않는지(NoMockAuthRouteTest).
        // web/app/api/**/route.ts 는 위에서 이미 선언돼 있다.
        exclude '**/build/**'
        exclude 'web/node_modules/**'
        exclude 'web/.next/**'
    }).withPropertyName('dockerfilesAndBuildScripts')
            .withPathSensitivity(PathSensitivity.RELATIVE)
}
