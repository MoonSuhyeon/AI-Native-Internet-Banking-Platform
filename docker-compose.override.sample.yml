# 로컬 개발 전용 오버라이드 견본.
#
# 쓰는 법:
#   cp docker-compose.override.sample.yml docker-compose.override.yml
# compose 가 override 파일을 자동으로 합쳐 읽는다. 이 파일(override.yml)은
# .gitignore 에 있어야 하며, **커밋하지 않는다.**
#
# 왜 별도 파일인가:
#   fraud-agent 는 운영 compose 에서 ports 를 노출하지 않는다. 호스트에 8090 이
#   열리면 게이트웨이를 우회해 X-Employee-Id 를 손으로 붙일 수 있고, 그러면
#   "게이트웨이가 주입한 신원이라 믿는다"는 전제가 무너진다.
#   그래도 로컬에서 curl 로 직접 찔러봐야 할 때가 있으므로, 그 편의는 이 파일로
#   **각 개발자가 자기 환경에만** 연다. 운영 compose 는 안전한 채로 남는다.

services:
  fraud-agent:
    ports:
      - "8090:8090"
    # 직접 접근으로 신원 헤더까지 시험하려면 게이트웨이와 같은 시크릿을 준다.
    # 비워 두면 사이드카는 헤더를 믿지 않고 감사에 actor_id 가 NULL 로 남는다 —
    # 그것이 기본값이고, 그 상태가 정상이다.
    # environment:
    #   FRAUD_GATEWAY_SHARED_SECRET: local-dev-secret

  # 직원용 상담 조회(STAFF_*)를 로컬에서 돌리려면 게이트웨이와 같은 시크릿이 필요하다.
  # 비워 두면 상담 서비스가 X-Employee-Id 를 믿지 않아 "직원 권한이 필요합니다" 로
  # 거절한다 — 그것이 기본값이고, 신원을 확인할 수 없으니 그 상태가 맞다.
  #
  # 이 값을 넣을 때는 api-gateway 쪽 CONSULTATION_GATEWAY_SHARED_SECRET 도
  # 같은 값으로 맞춰야 한다. 한쪽만 넣으면 조용히 거절되고 원인이 안 보인다.
  # consultation-service:
  #   environment:
  #     CONSULTATION_GATEWAY_SHARED_SECRET: local-dev-secret
