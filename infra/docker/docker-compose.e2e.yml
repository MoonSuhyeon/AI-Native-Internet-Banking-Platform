# =============================================================================
# E2E 용 최소 백엔드 스택
#
# **왜 따로 두는가.** 루트 docker-compose.yml 은 30개가 넘는 서비스를 띄우고
# `C:/logs/internet-banking:/logs` 같은 Windows 전용 볼륨을 쓴다. CI(Linux)에서 그대로
# 못 돌고, 돌더라도 프론트 화면 하나 검증하는 데 과하다.
#
# **왜 필요한가.** 지금 Playwright 는 `npm run dev` 만 띄우고 백엔드 없이 돈다.
# 그 상태로는 프론트가 기대하는 응답 모양과 백엔드가 실제로 주는 모양이 어긋나도 잡히지 않는다.
# 실제로 상환 스케줄 화면은 전 필드가 어긋난 채(seq/scheduledDt/paidYn vs
# installmentNo/dueDate/rschStatusCd) 3개월 넘게 방치됐는데, 표가
# `{schedules.length > 0 && ...}` 뒤에 있어 백엔드가 없으면 아예 렌더링되지 않는다 —
# 즉 백엔드 없는 E2E 는 통과한다.
#
# 그래서 이 스택은 "화면이 진짜 응답으로 그려지는가"만 본다.
#
# 담은 것: 프론트가 직접 부르는 세 서비스와 그 기동에 필요한 것들.
#   customer-service(8081) — 인증·고객
#   core-banking  (8082) — 수신·결제
#   loan-service  (8083) — 여신 (advisory 소스를 같은 JVM 으로 컴파일)
#   + loan-db / common-db / customer-db / core-banking-db / redis / kafka
#
# 모니터링·에이전트·타행은 뺐다 — 화면 렌더에 관여하지 않는다.
#
# 데이터는 Flyway 시드 마이그레이션이 넣는다 — 별도 seed 스크립트가 없다.
#   여신: 고객 1006 / 계약 9201 / 상환 12회차(PAID·OVERDUE·DUE)
#
# **타입 생성원이기도 하다.** 세 서비스 모두 springdoc 으로 /v3/api-docs 를 낸다.
# web/lib/generated/*.d.ts 는 그 스펙에서 생성한다(web/scripts/generate-api-types.sh).
# 손으로 쓴 인터페이스가 백엔드와 어긋나는 문제를 원천에서 없애기 위해서다.
#
# 사용:
#   docker compose -f infra/docker/docker-compose.e2e.yml up -d --wait
#   cd web && npm run test:e2e:contract
# =============================================================================

services:
  loan-db:
    # advisory RAG 마이그레이션(V21)이 CREATE EXTENSION vector 를 쓴다 —
    # 순정 postgres 로는 "extension vector is not available" 로 기동이 실패한다.
    # 루트 compose 의 loan-db 와 같은 이미지다.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: loan_db
      POSTGRES_USER: loan
      POSTGRES_PASSWORD: loan
    # 포트를 호스트에 열지 않는다 — 테스트는 loan-service 를 통해서만 본다.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loan -d loan_db"]
      interval: 5s
      timeout: 3s
      retries: 20

  common-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: common_db
      POSTGRES_USER: common
      POSTGRES_PASSWORD: common
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U common -d common_db"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # 루트 스택과 같은 KRaft 단일 노드 구성. loan-service 가 리스너를 띄우므로 필요하다.
  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      # E2E 는 토픽을 미리 만들지 않는다. 리스너가 없는 토픽을 구독해도 죽지 않게 자동생성을 켠다.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list"]
      interval: 10s
      timeout: 5s
      retries: 12

  loan-service:
    build:
      context: ../..
      dockerfile: services/loan-service/Dockerfile
    ports:
      - "8083:8083"
    environment:
      LOAN_APP_PORT: 8083
      LOAN_DB_HOST: loan-db
      LOAN_DB_PORT: 5432
      LOAN_DB_NAME: loan_db
      LOAN_DB_USER: loan
      LOAN_DB_PASSWORD: loan
      COMMON_DB_HOST: common-db
      COMMON_DB_PORT: 5432
      COMMON_DB_NAME: common_db
      COMMON_DB_USER: common
      COMMON_DB_PASSWORD: common
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      CRYPTO_KEY_BASE64: aW50ZXJuZXQtYmFuay1kZXYta2V5LTMyYnl0ZXMhISE=
      LOAN_DOCUMENT_STORAGE_TYPE: filesystem
      LOAN_DOCUMENT_STORAGE_DIR: /tmp/loan-documents
      LOG_DIR: /tmp/logs
    depends_on:
      loan-db:
        condition: service_healthy
      common-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  customer-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: customer_db
      POSTGRES_USER: customer
      POSTGRES_PASSWORD: customer
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U customer -d customer_db"]
      interval: 5s
      timeout: 3s
      retries: 20

  core-banking-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: core_banking
      POSTGRES_USER: core
      POSTGRES_PASSWORD: core
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U core -d core_banking"]
      interval: 5s
      timeout: 3s
      retries: 20

  customer-service:
    build:
      context: ../..
      dockerfile: services/customer-service/Dockerfile
    ports:
      - "8081:8081"
    environment:
      CUSTOMER_APP_PORT: 8081
      CUSTOMER_DB_HOST: customer-db
      CUSTOMER_DB_PORT: 5432
      CUSTOMER_DB_NAME: customer_db
      CUSTOMER_DB_USER: customer
      CUSTOMER_DB_PASSWORD: customer
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: internet-banking-jwt-secret-key-must-be-at-least-32-chars!!
      CRYPTO_KEY_BASE64: aW50ZXJuZXQtYmFuay1kZXYta2V5LTMyYnl0ZXMhISE=
      LOG_DIR: /tmp/logs
    depends_on:
      customer-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  core-banking:
    build:
      context: ../..
      dockerfile: services/core-banking/Dockerfile
    ports:
      - "8082:8082"
    environment:
      # 결제계 시각 컬럼이 TIMESTAMPTZ 라 JVM 타임존이 저장 의미에 관여한다.
      # db-payment/V23 의 UTC 해석 전제와 한 세트다 — 루트 compose 와 같게 못 박는다.
      TZ: UTC
      SPRING_PROFILES_ACTIVE: docker
      CORE_BANKING_APP_PORT: 8082
      BANK_CODE: "A"
      CORE_BANKING_DB_HOST: core-banking-db
      CORE_BANKING_DB_PORT: 5432
      CORE_BANKING_DB_NAME: core_banking
      CORE_BANKING_DB_USER: core
      CORE_BANKING_DB_PASSWORD: core
      CUSTOMER_SERVICE_URL: http://customer-service:8081
      KFTC_KAFKA_BOOTSTRAP: kafka:29092
      BOK_KAFKA_BOOTSTRAP: kafka:29092
      INTERNAL_KAFKA_BOOTSTRAP: kafka:29092
      KFTC_CONSUMER_GROUP: core-banking-kftc-e2e
      BOK_CONSUMER_GROUP: core-banking-bok-e2e
      INTERNAL_CONSUMER_GROUP: core-banking-internal-e2e
      # 정본은 payment.kafka.missing-topics-fatal 이다(BokKafkaConfig 등의 @Value).
      # 루트 compose 는 SPRING_KAFKA_LISTENER_MISSING_TOPICS_FATAL 을 주는데 그 키는
      # 이 코드가 읽지 않는다 — E2E 는 토픽을 미리 만들지 않으므로 정확한 키로 꺼야 한다.
      PAYMENT_KAFKA_MISSING_TOPICS_FATAL: "false"
      APP_CORS_ENABLED: "true"
      LOG_DIR: /tmp/logs
    depends_on:
      core-banking-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/api/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
