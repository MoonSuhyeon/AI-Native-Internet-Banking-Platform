# =============================================================================
# Internet Banking — 운영 docker-compose (Oracle Cloud Free Tier 24GB 기준)
#
# - 모든 앱 서비스는 GHCR 이미지를 pull 해서 사용 (CI/CD에서 push)
# - 메모리 합계 ~14GB (24GB 중 시스템·여유 10GB 확보)
# - 환경변수는 .env.prod 분리 (커밋 금지)
# - 로그 회전: max-size 10m, max-file 3
# - 재시작 정책: unless-stopped (수동 stop 외 자동 복구)
#
# 사용:
#   docker compose -f infra/docker/docker-compose.prod.yml --env-file .env.prod pull
#   docker compose -f infra/docker/docker-compose.prod.yml --env-file .env.prod up -d
# =============================================================================
name: internet-banking-prod

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-restart: &default-restart
  restart: unless-stopped

# =============================================================================
# 인프라 (DB ×6, Kafka, Schema Registry, Redis, Prometheus, Grafana)
# =============================================================================
services:
  customer-db:
    image: postgres:16-alpine
    container_name: ib-customer-db
    <<: *default-restart
    logging: *default-logging
    environment:
      POSTGRES_DB: ${CUSTOMER_DB_NAME:-customer_db}
      POSTGRES_USER: ${CUSTOMER_DB_USER:-customer}
      POSTGRES_PASSWORD: ${CUSTOMER_DB_PASSWORD}
    volumes:
      - customer-db-data:/var/lib/postgresql/data
    mem_limit: 384m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CUSTOMER_DB_USER:-customer} -d ${CUSTOMER_DB_NAME:-customer_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 수신·결제 통합 DB. 스키마 둘(deposit / payment)을 한 데이터베이스에 담아
  # 자행이체를 단일 트랜잭션으로 처리한다 (docs/decisions/core-banking-merge.md).
  core-banking-db:
    image: postgres:16-alpine
    container_name: ib-core-banking-db
    <<: *default-restart
    logging: *default-logging
    environment:
      POSTGRES_DB: ${CORE_BANKING_DB_NAME:-core_banking}
      POSTGRES_USER: ${CORE_BANKING_DB_USER:-core}
      POSTGRES_PASSWORD: ${CORE_BANKING_DB_PASSWORD}
    volumes:
      - core-banking-db-data:/var/lib/postgresql/data
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CORE_BANKING_DB_USER:-core} -d ${CORE_BANKING_DB_NAME:-core_banking}"]
      interval: 10s
      timeout: 5s
      retries: 5

  loan-db:
    image: postgres:16-alpine
    container_name: ib-loan-db
    <<: *default-restart
    logging: *default-logging
    environment:
      POSTGRES_DB: ${LOAN_DB_NAME:-loan_db}
      POSTGRES_USER: ${LOAN_DB_USER:-loan}
      POSTGRES_PASSWORD: ${LOAN_DB_PASSWORD}
    volumes:
      - loan-db-data:/var/lib/postgresql/data
    mem_limit: 384m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LOAN_DB_USER:-loan} -d ${LOAN_DB_NAME:-loan_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  common-db:
    image: postgres:16-alpine
    container_name: ib-common-db
    <<: *default-restart
    logging: *default-logging
    environment:
      POSTGRES_DB: ${COMMON_DB_NAME:-common_db}
      POSTGRES_USER: ${COMMON_DB_USER:-common}
      POSTGRES_PASSWORD: ${COMMON_DB_PASSWORD}
    volumes:
      - common-db-data:/var/lib/postgresql/data
    mem_limit: 384m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${COMMON_DB_USER:-common} -d ${COMMON_DB_NAME:-common_db}"]
      interval: 10s
      timeout: 5s
      retries: 5


  ai-db:
    image: pgvector/pgvector:pg16
    container_name: ib-ai-db
    <<: *default-restart
    logging: *default-logging
    environment:
      POSTGRES_DB: ${AI_DB_NAME:-ai_db}
      POSTGRES_USER: ${AI_DB_USER:-ai}
      POSTGRES_PASSWORD: ${AI_DB_PASSWORD}
    volumes:
      - ai-db-data:/var/lib/postgresql/data
      - ../../infra/ai-db/init:/docker-entrypoint-initdb.d:ro
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AI_DB_USER:-ai} -d ${AI_DB_NAME:-ai_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ib-redis
    <<: *default-restart
    logging: *default-logging
    volumes:
      - redis-data:/data
    mem_limit: 256m
    command: ["redis-server", "--maxmemory", "200mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  kafka:
    image: apache/kafka:3.8.0
    container_name: ib-kafka
    <<: *default-restart
    logging: *default-logging
    environment:
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_RETENTION_MINUTES: 10080
      # Oracle 메모리 절약 (기본 1G → 512M)
      KAFKA_HEAP_OPTS: "-Xmx512M -Xms256M"
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 15s
      timeout: 10s
      retries: 5

  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.0
    container_name: ib-schema-registry
    <<: *default-restart
    logging: *default-logging
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL: BACKWARD
      SCHEMA_REGISTRY_HEAP_OPTS: "-Xmx256M -Xms128M"
    mem_limit: 384m
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/subjects || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:latest
    container_name: ib-prometheus
    <<: *default-restart
    logging: *default-logging
    volumes:
      - ../../infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../../infra/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    mem_limit: 384m
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'   # Oracle 디스크 절약

  grafana:
    image: grafana/grafana:latest
    container_name: ib-grafana
    <<: *default-restart
    logging: *default-logging
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - ../../infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    mem_limit: 256m
    depends_on:
      - prometheus

  # ===========================================================================
  # 앱 서비스 (모두 GHCR 이미지 사용, env_file .env.prod)
  # ===========================================================================

  customer-service:
    image: ghcr.io/${GITHUB_OWNER}/customer-service:${CUSTOMER_IMAGE_TAG:-latest}
    container_name: ib-customer-service
    <<: *default-restart
    logging: *default-logging
    env_file: ../../.env.prod
    environment:
      SPRING_PROFILES_ACTIVE: prod
      CUSTOMER_DB_HOST: customer-db
      REDIS_HOST: redis
    mem_limit: 640m
    depends_on:
      customer-db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 수신 + 결제 병합 서비스.
  core-banking:
    image: ghcr.io/${GITHUB_OWNER}/core-banking:${CORE_BANKING_IMAGE_TAG:-latest}
    container_name: ib-core-banking
    <<: *default-restart
    logging: *default-logging
    env_file: ../../.env.prod
    environment:
      # db-payment/V23 의 UTC 해석 전제와 한 세트다. 바뀌면 저장된 시각의 의미가 어긋난다.
      TZ: UTC
      SPRING_PROFILES_ACTIVE: prod
      CORE_BANKING_APP_PORT: 8082
      BANK_CODE: "A"
      CORE_BANKING_DB_HOST: core-banking-db
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KFTC_KAFKA_BOOTSTRAP: kafka:29092
      BOK_KAFKA_BOOTSTRAP: kafka:29092
      INTERNAL_KAFKA_BOOTSTRAP: kafka:29092
    mem_limit: 1g
    depends_on:
      core-banking-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  loan-service:
    image: ghcr.io/${GITHUB_OWNER}/loan-service:${LOAN_IMAGE_TAG:-latest}
    container_name: ib-loan-service
    <<: *default-restart
    logging: *default-logging
    env_file: ../../.env.prod
    environment:
      SPRING_PROFILES_ACTIVE: prod
      LOAN_DB_HOST: loan-db
      AI_DB_HOST: ai-db
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
    mem_limit: 896m
    depends_on:
      loan-db:
        condition: service_healthy
      ai-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy

  ai-service:
    image: ghcr.io/${GITHUB_OWNER}/ai-service:${AI_IMAGE_TAG:-latest}
    container_name: ib-ai-service
    <<: *default-restart
    logging: *default-logging
    env_file: ../../.env.prod
    environment:
      SPRING_PROFILES_ACTIVE: prod
      AI_DB_HOST: ai-db
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    mem_limit: 768m
    depends_on:
      ai-db:
        condition: service_healthy
      redis:
        condition: service_healthy

  auto-loan-review:
    image: ghcr.io/${GITHUB_OWNER}/auto-loan-review:${AUTO_REVIEW_IMAGE_TAG:-latest}
    container_name: ib-auto-loan-review
    <<: *default-restart
    logging: *default-logging
    env_file: ../../.env.prod
    environment:
      SPRING_PROFILES_ACTIVE: prod
      AUTO_LOAN_REVIEW_APP_PORT: ${AUTO_LOAN_REVIEW_APP_PORT:-8089}
      AI_DB_HOST: ai-db
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    mem_limit: 768m
    depends_on:
      ai-db:
        condition: service_healthy
      kafka:
        condition: service_healthy

  review-ai-gateway:
    image: ghcr.io/${GITHUB_OWNER}/review-ai-gateway:${REVIEW_AIGW_IMAGE_TAG:-latest}
    container_name: ib-review-ai-gateway
    <<: *default-restart
    logging: *default-logging
    env_file: ../../.env.prod
    environment:
      SPRING_PROFILES_ACTIVE: prod
      LOAN_SERVICE_URL: http://loan-service:8083
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    mem_limit: 512m
    depends_on:
      kafka:
        condition: service_healthy

  # 주 진입점(8080). gateway-service(레거시·소스 삭제) → api-gateway 컷오버 완료.
  # 외부 노출 포트는 8080 그대로 재사용(Oracle 방화벽 룰 변경 없음).
  api-gateway:
    image: ghcr.io/${GITHUB_OWNER}/api-gateway:${API_GATEWAY_IMAGE_TAG:-latest}
    container_name: ib-api-gateway
    <<: *default-restart
    logging: *default-logging
    env_file: ../../.env.prod
    environment:
      GATEWAY_PORT: 8080
      JWT_SECRET: ${JWT_SECRET}
      # 라우팅 대상 — api-gateway 변수명은 *_SERVICE_HOST / *_SERVICE_PORT (레거시의 *_APP_PORT 아님)
      CUSTOMER_SERVICE_HOST: customer-service
      CUSTOMER_SERVICE_PORT: 8081
      DEPOSIT_SERVICE_HOST: core-banking
      DEPOSIT_SERVICE_PORT: 8082
      LOAN_SERVICE_HOST: loan-service
      LOAN_SERVICE_PORT: 8083
      PAYMENT_SERVICE_HOST: core-banking
      PAYMENT_SERVICE_PORT: 8084
      # AI(auto-loan-review)·상담은 게이트웨이 미경유 구조 → 라우트 없음(의도적).
      # redis 는 api-gateway 가 사용하지 않음 → 미설정.
    # 호스트 포트를 열지 않는다. Caddy 가 유일한 외부 진입점이고, 게이트웨이를
    # 밖에 직접 노출하면 HTTPS 를 우회해 평문으로 부를 수 있는 길이 남는다.
    expose:
      - "8080"
    mem_limit: 512m
    depends_on:
      - customer-service
      - core-banking
      - loan-service

  consultation-service:
    image: ghcr.io/${GITHUB_OWNER}/consultation-service:${CONSULTATION_IMAGE_TAG:-latest}
    container_name: ib-consultation-service
    <<: *default-restart
    logging: *default-logging
    env_file: ../../.env.prod
    mem_limit: 384m
    depends_on:
      kafka:
        condition: service_healthy

  deposit-api:
    image: ghcr.io/${GITHUB_OWNER}/deposit-api:${DEPOSIT_API_IMAGE_TAG:-latest}
    container_name: ib-deposit-api
    <<: *default-restart
    logging: *default-logging
    env_file: ../../.env.prod
    mem_limit: 256m
    depends_on:
      core-banking-db:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # data-tools 는 24h 상주 서비스 아님. compose 에 등록만 하고 기본 비활성.
  # 사용: docker compose run --rm data-tools python scripts/seed_hmda_rag.py
  data-tools:
    image: ghcr.io/${GITHUB_OWNER}/data-tools:${DATA_TOOLS_IMAGE_TAG:-latest}
    container_name: ib-data-tools
    env_file: ../../.env.prod
    profiles: ["tools"]   # 기본 비활성. 명시적으로 run 할 때만 동작
    volumes:
      - data-tools-output:/app/data

  # ===========================================================================
  # 프론트 · 리버스 프록시
  # ===========================================================================

  # 프론트(Next.js). 예전에는 prod compose 에 아예 없어서 백엔드만 떴다.
  #
  # NEXT_PUBLIC_* 은 빌드 시점에 번들에 박히므로 이미지는 도메인을 모른다.
  # Caddy 가 같은 오리진에서 /api 를 게이트웨이로 넘기기 때문에 상대경로면 충분하다.
  # 서버측 프록시(app/api/**)가 쓰는 주소는 런타임 환경변수라 여기서 준다.
  web:
    image: ghcr.io/${GITHUB_OWNER}/web:${WEB_IMAGE_TAG:-latest}
    container_name: ib-web
    <<: *default-restart
    logging: *default-logging
    environment:
      CUSTOMER_API_URL: http://api-gateway:8080
      CONSULTATION_API_URL: http://consultation-service:8087
    expose:
      - "3000"
    mem_limit: 512m
    depends_on:
      - api-gateway

  # HTTPS 종단 + 리버스 프록시. 인증서 발급·갱신을 스스로 한다.
  #
  # nginx + certbot 조합을 쓰지 않는 이유: 갱신 크론과 재로드를 따로 돌봐야 하고,
  # 그 갱신이 조용히 멎으면 90일 뒤 사이트가 통째로 죽는다.
  #
  # SITE_DOMAIN·ACME_EMAIL 이 .env.prod 에 있어야 한다. 도메인이 실제로 이 서버를
  # 가리키기 전에 띄우면 Let's Encrypt 검증이 실패한다 — DNS 를 먼저 붙일 것.
  caddy:
    image: caddy:2-alpine
    container_name: ib-caddy
    <<: *default-restart
    logging: *default-logging
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # 발급받은 인증서. 볼륨이 없으면 재시작마다 재발급을 시도하다
      # Let's Encrypt 발급 한도(주당 5회)에 걸린다.
      - caddy-data:/data
      - caddy-config:/config
      - caddy-logs:/var/log/caddy
    mem_limit: 128m
    depends_on:
      - web
      - api-gateway

volumes:
  caddy-data:
  caddy-config:
  caddy-logs:
  customer-db-data:
  core-banking-db-data:
  loan-db-data:
  common-db-data:
  ai-db-data:
  redis-data:
  prometheus-data:
  grafana-data:
  data-tools-output:
