global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alerts.yml"
  # 대시보드가 매번 다시 계산하지 않도록 미리 접어 둔 지표.
  # 특히 histogram_quantile 과 긴 창의 rate() 가 비싸다.
  - "rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['host.docker.internal:9090']

  # 잡 이름은 compose 서비스 이름과 맞춘다. 레거시 gateway-service 는 api-gateway 로 바뀌었다.
  - job_name: 'api-gateway'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['host.docker.internal:8080']

  - job_name: 'customer-service'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['host.docker.internal:8081']

  # 수신·결제 병합 서비스. context-path 가 /api 이므로 액추에이터도 /api 아래에 있다.
  # A/B 두 은행을 같은 이미지로 띄우므로 둘 다 긁는다 — B(8180)는 타행이체 상대 은행이라
  # 여기 지표가 없으면 타행 흐름의 절반이 보이지 않는다.
  - job_name: 'core-banking-a'
    metrics_path: /api/actuator/prometheus
    static_configs:
      - targets: ['host.docker.internal:8082']

  - job_name: 'core-banking-b'
    metrics_path: /api/actuator/prometheus
    static_configs:
      - targets: ['host.docker.internal:8180']

  - job_name: 'loan-service'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['host.docker.internal:8083']

  # master-service 잡을 지웠다. compose 에도 없고 8085 를 게시하는 서비스도 없어
  # 항상 DOWN 이었다. 늘 빨간 대상은 진짜 장애를 가린다.

  - job_name: 'windows-exporter'
    static_configs:
      - targets: ['host.docker.internal:9182']

  # node-exporter 잡도 지웠다 — compose 에 그 서비스가 없다.
  # (windows-exporter 는 호스트에서 따로 띄우는 것이라 남긴다. .env.sample 의
  #  WINDOWS_EXPORTER_PORT 참고.)

  - job_name: 'kafka-exporter-kftc'
    static_configs:
      - targets: ['host.docker.internal:9308']
        labels:
          cluster: kftc

  - job_name: 'kafka-exporter-bok'
    static_configs:
      - targets: ['host.docker.internal:9309']
        labels:
          cluster: bok

  - job_name: 'kafka-exporter-internal'
    static_configs:
      - targets: ['host.docker.internal:9310']
        labels:
          cluster: internal

  # 파이썬 서비스라 Micrometer 가 붙여주는 application 라벨이 없다.
  # 대시보드는 JVM 서비스와 같은 방식으로 application 으로 거르므로 여기서 달아준다 —
  # 없으면 chatbot 대시보드 패널 5종이 조용히 빈다.
  - job_name: 'consultation-service'
    metrics_path: /metrics
    static_configs:
      # 컨테이너 이름으로 긁는다. host.docker.internal 을 쓰면 호스트 포트가 열려
      # 있어야 하는데, 그 포트가 곧 게이트웨이 우회로다 — 지표 때문에 인가에
      # 구멍을 남기게 된다. fraud-agent 가 원래 이 방식이었다.
      - targets: ['consultation-service:8087']
        labels:
          application: consultation-service

  - job_name: 'review-ai-gateway'
    metrics_path: /actuator/prometheus
    static_configs:
      # 컨테이너 이름으로 긁는다 — 호스트 포트를 닫았다.
      - targets: ['review-ai-gateway:8088']

  - job_name: 'auto-loan-review'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['auto-loan-review:8089']

  # 조사 에이전트. 격리망(fraud-internal)에 있어 호스트로 포트를 열지 않는다 —
  # 그 안에서 컨테이너 이름으로 긁는다(prometheus 를 같은 망에 붙여 두었다).
  # 파이썬이라 Micrometer 의 application 라벨이 없어 여기서 달아준다.
  - job_name: 'fraud-agent'
    metrics_path: /metrics
    static_configs:
      - targets: ['fraud-agent:8090']
        labels:
          application: fraud-agent

  # 서류 에이전트. doc 프로필로만 뜨므로 평소에는 DOWN 이다.
  - job_name: 'fds-detector'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['host.docker.internal:8092']

  - job_name: 'doc-agent'
    metrics_path: /actuator/prometheus
    static_configs:
      # 컨테이너 내부 포트는 8087 이다(호스트 8091 매핑은 걷어냈다).
      - targets: ['doc-agent:8087']

  # --- 모니터링 스택 직접 메트릭 ---

  - job_name: 'alertmanager'
    metrics_path: /metrics
    static_configs:
      - targets: ['alertmanager:9093']
        labels:
          component: monitoring-stack

  - job_name: 'grafana'
    metrics_path: /metrics
    static_configs:
      - targets: ['grafana:3000']
        labels:
          component: monitoring-stack

  - job_name: 'loki'
    metrics_path: /metrics
    static_configs:
      - targets: ['loki:3100']
        labels:
          component: monitoring-stack

  # --- Blackbox HTTP 프로브 ---

  - job_name: 'monitoring-stack-probe'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://langfuse:3000/api/public/health
        labels:
          component: monitoring-stack
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
