name: Test consultation-service

# consultation 테스트를 실제로 돌리는 유일한 자리다.
#
# 이 워크플로가 생기기 전까지 agents/consultation/tests/ 의 20여 개 파일은
# **어디서도 실행되지 않았다.** 배포 워크플로는 이미지를 빌드해 올릴 뿐 테스트를
# 돌리지 않는다. 감사 배선 테스트를 추가하면서 그 사실을 알게 됐고, 실행 경로가
# 없으면 테스트는 발판일 뿐이라 함께 만든다.

on:
  push:
    branches: [main]
    paths:
      - 'agents/consultation/**'
      # 공유 감사 계약이 바뀌면 상담 쪽 배선도 다시 확인해야 한다.
      - 'agents/harness-core/python/**'
      - 'agents/harness-core/src/main/resources/db/harness/**'
      - '.github/workflows/test-consultation.yml'
  pull_request:
    paths:
      - 'agents/consultation/**'
      - 'agents/harness-core/python/**'
      - '.github/workflows/test-consultation.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      # 감사 테이블은 JSONB 와 INSERT-ONLY 트리거에 기대므로 SQLite 로는 검증되지 않는다.
      # 실제 엔진이 필요하다.
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: audittest
          POSTGRES_USER: audit
          POSTGRES_PASSWORD: audit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U audit -d audittest"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: agents/consultation

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 테스트 실행
        env:
          # conftest 가 기동 시 요구한다. 테스트 본체는 SQLite 픽스처를 쓴다.
          CONSULTATION_DATABASE_URL: postgresql+psycopg://audit:audit@localhost:5432/audittest
          CONSULTATION_KAFKA_ENABLED: 'false'
          # 감사 배선 검증용 실제 PostgreSQL. 없으면 해당 테스트는 skip 이 아니라 실패한다 —
          # 조용히 건너뛰면 CI 가 초록인데 감사는 검증되지 않은 상태로 돌아간다.
          CONSULTATION_AUDIT_TEST_DSN: postgresql+psycopg://audit:audit@localhost:5432/audittest
        run: pytest -q
