name: Web CI

# web/ 프론트엔드 변경 시 Vitest 단위 테스트를 자동 실행한다.
# (테스트 하네스 — "테스트 없이 커밋" 재발 방지. 브랜치 보호 규칙의 required check 로 걸면 머지 차단까지.)
#
# contract 잡은 실제 백엔드를 상대로 돈다. 그래서 **백엔드만 고쳤을 때** 그것을
# 확인할 방법이 없었다 — 트리거가 web/** 뿐이라 services/ 를 고친 커밋에서는
# 돌지 않고, 다음에 누가 web 을 건드릴 때까지 결과를 알 수 없었다.
# 실제로 core-banking 이 깨끗한 DB 에서 기동조차 못 하던 것을 고친 뒤,
# 그 검증을 다음 web 커밋까지 기다려야 했다.
#
# workflow_dispatch 로 손으로 돌릴 수 있게 연다: gh workflow run "Web CI"
# 워크플로 자신이 바뀔 때도 돌게 경로에 넣는다 — 트리거를 고쳐 놓고 그 트리거가
# 도는지 확인할 길이 없으면 같은 자리로 돌아온다.
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/web-ci.yml'
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/web-ci.yml'
  workflow_dispatch:

jobs:
  # 타입 오류를 빌드가 무시하고 있었다(next.config.js 의 ignoreBuildErrors).
  # 그래서 상담 대기열이 null 을 1970년으로 계산해 멀쩡한 상담을 종료시키던 것이
  # 한 번도 안 걸렸다. 여기서 막는다.
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck

  # 미사용 변수 11건을 정리해 0건이 됐으므로 이제 막는다. 대부분은 스타일 문제가
  # 아니라 도달 불가 코드였다 — 지우고 나서야 그 사실이 드러났다.
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run test:run

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  # 실제 백엔드를 상대로 응답 계약을 검증한다.
  #
  # 위 e2e 잡은 백엔드 없이 돈다. 그 상태로는 프론트가 기대하는 응답 모양과 백엔드가
  # 실제로 주는 모양이 어긋나도 잡히지 않는다 — 표가 `{schedules.length > 0 && ...}`
  # 뒤에 있어 데이터가 없으면 렌더링 자체가 일어나지 않고 초록으로 통과하기 때문이다.
  # 상환 스케줄 화면이 전 필드가 어긋난 채 3개월 넘게 방치된 것이 그래서였다.
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      # loan-service + 그것이 기동에 요구하는 것들(loan-db/common-db/redis/kafka).
      # 데이터는 Flyway 시드 마이그레이션이 넣는다 — 별도 seed 단계가 없다.
      - name: 백엔드 기동
        run: docker compose -f infra/docker/docker-compose.e2e.yml up -d --wait

      - name: 의존성 설치
        working-directory: web
        run: npm ci
      - working-directory: web
        run: npx playwright install --with-deps chromium

      # 커밋된 생성 타입이 지금 백엔드와 같은지 본다.
      # 백엔드 DTO 를 바꾸고 타입을 재생성하지 않으면 여기서 diff 로 걸린다 —
      # 프론트가 옛 모양을 계속 믿는 상태를 막는 장치다.
      - name: API 타입 드리프트 검사
        working-directory: web
        run: |
          bash scripts/generate-api-types.sh
          if ! git diff --exit-code --stat -- lib/generated; then
            echo "::error::생성 타입이 백엔드와 다르다. web/scripts/generate-api-types.sh 를 돌려 커밋한다."
            git diff -- lib/generated | head -100
            exit 1
          fi

      - name: 계약 E2E
        working-directory: web
        env:
          NEXT_PUBLIC_LOAN_API_URL: http://localhost:8083
          NEXT_PUBLIC_DEPOSIT_API_URL: http://localhost:8082/api
          NEXT_PUBLIC_API_URL: http://localhost:8081
        run: npm run test:e2e:contract

      # 실패 원인이 프론트인지 백엔드인지 로그 없이는 못 가린다.
      - name: 실패 시 백엔드 로그
        if: failure()
        run: docker compose -f infra/docker/docker-compose.e2e.yml logs --tail 200 loan-service core-banking customer-service

      - name: 정리
        if: always()
        run: docker compose -f infra/docker/docker-compose.e2e.yml down -v
