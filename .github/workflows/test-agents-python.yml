name: Test goal-agent & harness-core

# goal-agent 와 harness-core(python) 테스트를 실제로 돌리는 자리다.
#
# 이 워크플로가 생기기 전까지:
#   - goal-agent 에는 테스트가 한 개도 없었다. 감사 배선은 손으로 한 번 돌려본 것이
#     전부였고, record_goal_turn 호출을 지워도 깨지는 것이 없었다.
#   - harness-core/python/tests 는 있었지만 **어디서도 실행되지 않았다.** 감사 계약
#     정본(SQL)과 각 에이전트의 사본을 대조하는 테스트가 거기 있는데, 사본이 어긋나도
#     아무도 몰랐다.
#
# 실행 경로가 없으면 테스트는 발판일 뿐이라 테스트와 함께 만든다.
# consultation 은 PostgreSQL 서비스가 필요해 test-consultation.yml 로 따로 돈다.

on:
  push:
    branches: [main]
    paths:
      - 'agents/goal-agent/**'
      - 'agents/harness-core/python/**'
      - 'agents/harness-core/src/main/resources/db/harness/**'
      - '.github/workflows/test-agents-python.yml'
  pull_request:
    paths:
      - 'agents/goal-agent/**'
      - 'agents/harness-core/python/**'
      - 'agents/harness-core/src/main/resources/db/harness/**'
      - '.github/workflows/test-agents-python.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # requirements-dev.txt 가 harness-core 를 editable 로 설치한다.
      # **에이전트 디렉터리에서 실행해야 한다** — pip 은 requirements 안의 상대 경로를
      # 파일 위치가 아니라 현재 작업 디렉터리 기준으로 푼다.
      - name: 의존성 설치
        working-directory: agents/goal-agent
        run: pip install -r requirements-dev.txt

      # 감사 계약 정본(SQL)과 에이전트 사본 대조. consultation·goal-agent 양쪽 사본을
      # 여기서 함께 본다 — 계약이 깨지면 두 에이전트가 같이 틀어진다.
      - name: harness-core 계약 테스트
        working-directory: agents/harness-core/python
        run: pytest -q

      # 감사 저장소는 인메모리 spy 로 바꿔 끼우므로 DB 가 필요 없다.
      # 저장이 실제로 되는지(JSONB·INSERT-ONLY 트리거)는 test-consultation.yml 이
      # 실제 PostgreSQL 로 본다.
      - name: goal-agent 테스트
        working-directory: agents/goal-agent
        run: pytest -q
