name: internet-banking

services:

  # =============================================================
  # Database
  # =============================================================

  customer-db:
    image: postgres:16-alpine
    container_name: ib-customer-db
    environment:
      POSTGRES_DB: ${CUSTOMER_DB_NAME:-customer_db}
      POSTGRES_USER: ${CUSTOMER_DB_USER:-customer}
      POSTGRES_PASSWORD: ${CUSTOMER_DB_PASSWORD:-customer}
    ports:
      - "${CUSTOMER_DB_PORT:-5432}:5432"
    volumes:
      - customer-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CUSTOMER_DB_USER:-customer} -d ${CUSTOMER_DB_NAME:-customer_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # postgres 기본 shared_buffers 로 충분한 데모 규모
    mem_limit: 512m
  # A은행 코어뱅킹 DB. 수신(deposit)·결제(payment) 두 스키마를 한 데이터베이스에 담는다.
  # 자행이체를 하나의 트랜잭션으로 처리하기 위한 전제다 (docs/decisions/core-banking-merge.md).
  core-banking-db-a:
    image: postgres:16-alpine
    container_name: ib-core-banking-db-a
    environment:
      POSTGRES_DB: ${CORE_BANKING_DB_NAME:-core_banking}
      POSTGRES_USER: ${CORE_BANKING_DB_USER:-core}
      POSTGRES_PASSWORD: ${CORE_BANKING_DB_PASSWORD:-core}
    ports:
      - "${CORE_BANKING_DB_PORT_A:-5433}:5432"
    volumes:
      - core-banking-db-a-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CORE_BANKING_DB_USER:-core} -d ${CORE_BANKING_DB_NAME:-core_banking}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # 사이드카와 통신해야 하므로 agent-net 에도 붙는다.
    networks:
      - default
      - agent-net
    # postgres 기본 shared_buffers 로 충분한 데모 규모
    mem_limit: 512m
  loan-db:
    image: pgvector/pgvector:pg16
    container_name: ib-loan-db
    environment:
      POSTGRES_DB: ${LOAN_DB_NAME:-loan_db}
      POSTGRES_USER: ${LOAN_DB_USER:-loan}
      POSTGRES_PASSWORD: ${LOAN_DB_PASSWORD:-loan}
    ports:
      - "${LOAN_DB_PORT:-5434}:5432"
    volumes:
      - loan-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LOAN_DB_USER:-loan} -d ${LOAN_DB_NAME:-loan_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # postgres 기본 shared_buffers 로 충분한 데모 규모
    mem_limit: 512m
  common-db:
    image: postgres:16-alpine
    container_name: ib-common-db
    environment:
      POSTGRES_DB: ${COMMON_DB_NAME:-common_db}
      POSTGRES_USER: ${COMMON_DB_USER:-common}
      POSTGRES_PASSWORD: ${COMMON_DB_PASSWORD:-common}
    ports:
      - "${COMMON_DB_PORT:-5438}:5432"
    volumes:
      - common-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${COMMON_DB_USER:-common} -d ${COMMON_DB_NAME:-common_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # postgres 기본 shared_buffers 로 충분한 데모 규모
    mem_limit: 512m
  # B은행(다온뱅크) 코어뱅킹 DB.
  # 병합 전에는 B가 Mock 이라 저장할 곳이 없었다. 이제 A와 같은 구조의 실제 DB를 갖는다 —
  # 타행이체가 실제로 도착했는지 확인할 대상이 생겼다는 뜻이다.
  core-banking-db-b:
    image: postgres:16-alpine
    container_name: ib-core-banking-db-b
    environment:
      POSTGRES_DB: core_banking_b
      POSTGRES_USER: core
      POSTGRES_PASSWORD: core
    ports:
      # doc-agent-db가 5440을 쓰므로 충돌 회피용 5441
      - "${CORE_BANKING_DB_PORT_B:-5441}:5432"
    volumes:
      - core-banking-db-b-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U core -d core_banking_b"]
      interval: 10s
      timeout: 5s
      retries: 5
    # postgres 기본 shared_buffers 로 충분한 데모 규모
    mem_limit: 512m
  ai-db:
    image: pgvector/pgvector:pg16
    container_name: ib-ai-db
    environment:
      POSTGRES_DB: ${AI_DB_NAME:-ai_db}
      POSTGRES_USER: ${AI_DB_USER:-ai}
      POSTGRES_PASSWORD: ${AI_DB_PASSWORD:-ai}
    ports:
      - "${AI_DB_PORT:-5437}:5432"
    volumes:
      - ai-db-data:/var/lib/postgresql/data
      - ./infra/ai-db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AI_DB_USER:-ai} -d ${AI_DB_NAME:-ai_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # 사이드카와 통신해야 하므로 agent-net 에도 붙는다.
    networks:
      - default
      - agent-net
      - agent-closed
    # postgres 기본 shared_buffers 로 충분한 데모 규모
    mem_limit: 512m
  # =============================================================
  # Message Queue
  # =============================================================

  kafka:
    image: apache/kafka:3.8.0
    container_name: ib-kafka
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_RETENTION_MINUTES: 10080         # 7일. 기본값 1440(1일) — 그룹 정지 후 offset 보존 기간
      KAFKA_REPLICA_SELECTOR_CLASS: org.apache.kafka.common.replica.RackAwareReplicaSelector  # L8 rack awareness
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 5s
      retries: 5
    # 사이드카와 통신해야 하므로 agent-net 에도 붙는다.
    networks:
      - default
      - agent-net
      - agent-closed
    # KRaft 단일 브로커 데모 기준
    mem_limit: 1g
  # 결제계 Kafka 토픽 원샷 프로비저닝.
  # 단일 broker(auto-create=false)에 결제계 18개 토픽을 선생성하고 종료한다.
  # init-topics.sh(core-banking/infra)를 마운트해 kafka:29092 대상으로 1회 실행.
  payment-topic-init:
    image: apache/kafka:3.8.0
    container_name: ib-payment-topic-init
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
    volumes:
      - ./services/core-banking/infra/init-topics.sh:/init-topics.sh:ro
    entrypoint: ["/bin/bash", "/init-topics.sh"]
    restart: "no"

  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.0
    container_name: ib-schema-registry
    ports:
      - "18081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL: BACKWARD  # 구 consumer가 신 메시지 읽기 가능
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/subjects || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    # JVM. 스키마만 다룬다
    mem_limit: 512m
  # =============================================================
  # Cache
  # =============================================================

  redis:
    image: redis:7-alpine
    container_name: ib-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    # 사이드카와 통신해야 하므로 agent-net 에도 붙는다.
    networks:
      - default
      - agent-net
      - agent-closed
    # 캐시·상태만
    mem_limit: 512m
  # =============================================================
  # Application Services
  # =============================================================

  customer-service:
    build:
      context: .
      dockerfile: services/customer-service/Dockerfile
    container_name: ib-customer-service
    ports:
      - "${CUSTOMER_APP_PORT:-8081}:8081"
    environment:
      # 결제계 payment.delayed 를 소비해 고객 알림을 만든다.
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      CUSTOMER_APP_PORT: 8081
      CUSTOMER_DB_HOST: customer-db
      CUSTOMER_DB_PORT: 5432
      CUSTOMER_DB_NAME: ${CUSTOMER_DB_NAME:-customer_db}
      CUSTOMER_DB_USER: ${CUSTOMER_DB_USER:-customer}
      CUSTOMER_DB_PASSWORD: ${CUSTOMER_DB_PASSWORD:-customer}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-internet-banking-jwt-secret-key-must-be-at-least-32-chars!!}
      CRYPTO_KEY_BASE64: ${CRYPTO_KEY_BASE64:-aW50ZXJuZXQtYmFuay1kZXYta2V5LTMyYnl0ZXMhISE=}
      LOG_DIR: /logs
    volumes:
      - C:/logs/internet-banking:/logs
    depends_on:
      customer-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - default
      # 조사 사이드카가 안내 대상 구간(연령대)을 물으러 온다. 붙이지 않으면 이름이
      # 풀리지 않아 조회가 매번 실패하고, 맞춤 안내가 조용히 기본형으로 내려간다 —
      # 오류로 드러나지 않아서 "맞춤이 되는 줄 알았는데 안 되던" 상태가 된다.
      # core-banking-a 가 agent-net 에 붙어 상담 사이드카를 받는 것과 같은 방식이다.
      - fraud-internal
    # 힙 768m
    mem_limit: 1g
  # A은행 코어뱅킹 — 수신(deposit) + 결제(payment) 단일 서비스.
  # 병합 이유는 docs/decisions/core-banking-merge.md 참조.
  core-banking-a:
    build:
      context: .
      dockerfile: services/core-banking/Dockerfile
    container_name: ib-core-banking-a
    ports:
      - "${CORE_BANKING_PORT_A:-8082}:8082"
    environment:
      # 결제계 시각 컬럼이 TIMESTAMPTZ 로 바뀌면서 JVM 타임존이 저장 의미에 관여한다.
      # (LocalDateTime ↔ timestamptz 변환이 세션 타임존을 쓴다)
      # 기본값에 기대지 않고 못 박는다 — db-payment/V23 의 UTC 해석 전제와 한 세트다.
      TZ: UTC
      SPRING_PROFILES_ACTIVE: docker
      CORE_BANKING_APP_PORT: 8082
      BANK_CODE: "A"
      # 검증용: 자행 수수료를 일시적으로 켜 수수료 차감 경로를 실물로 확인한다.
      PAYMENT_FEE_INTRA_BANK: ${PAYMENT_FEE_INTRA_BANK:-0}
      CORE_BANKING_DB_HOST: core-banking-db-a
      CORE_BANKING_DB_PORT: 5432
      CORE_BANKING_DB_NAME: ${CORE_BANKING_DB_NAME:-core_banking}
      CORE_BANKING_DB_USER: ${CORE_BANKING_DB_USER:-core}
      CORE_BANKING_DB_PASSWORD: ${CORE_BANKING_DB_PASSWORD:-core}
      CUSTOMER_SERVICE_URL: http://customer-service:8081
      KFTC_KAFKA_BOOTSTRAP: kafka:29092
      BOK_KAFKA_BOOTSTRAP: kafka:29092
      INTERNAL_KAFKA_BOOTSTRAP: kafka:29092
      # 이상거래 사전 점검. 결제 임계 경로에 외부 호출을 넣는 변경이라 기본은 꺼 둔다 —
      # 탐지기가 안정적으로 뜨는 것을 확인한 뒤 DEPOSIT_FDS_ENABLED=true 로 켠다.
      DEPOSIT_FDS_ENABLED: ${DEPOSIT_FDS_ENABLED:-false}
      DEPOSIT_FDS_BASE_URL: http://fds-detector:8092
      DEPOSIT_FDS_TIMEOUT_MS: ${DEPOSIT_FDS_TIMEOUT_MS:-400}
      KFTC_CONSUMER_GROUP: core-banking-kftc-a
      BOK_CONSUMER_GROUP: core-banking-bok-a
      INTERNAL_CONSUMER_GROUP: core-banking-internal-a
      # 이 자리에는 SPRING_KAFKA_LISTENER_MISSING_TOPICS_FATAL 이 있었는데 코드가 읽지 않는 키였다
      # (정본은 payment.kafka.missing-topics-fatal — BokKafkaConfig 등의 @Value).
      # 즉 토픽 누락 시 죽지 않게 하려던 의도가 실제로는 적용된 적이 없다.
      #
      # 그래서 끄는 대신 순서를 보장한다. 토픽은 payment-topic-init 이 만들고, 아래
      # depends_on 이 그 완료를 기다린다. 없는 토픽에 붙으면 죽는 편이 낫다 —
      # 조용히 뜬 뒤 리스너만 죽어 있으면 결제 이벤트가 유실된다.
      APP_CORS_ENABLED: "true"
      LOG_DIR: /logs
    volumes:
      - C:/logs/internet-banking:/logs
    depends_on:
      core-banking-db-a:
        condition: service_healthy
      kafka:
        condition: service_healthy
      payment-topic-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/api/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    # 사이드카와 통신해야 하므로 agent-net 에도 붙는다.
    networks:
      - default
      - agent-net
    # 힙 768m
    mem_limit: 1g
  loan-service:
    build:
      context: .
      dockerfile: services/loan-service/Dockerfile
    container_name: ib-loan-service
    ports:
      - "${LOAN_APP_PORT:-8083}:8083"
    environment:
      LOAN_APP_PORT: 8083
      LOAN_DB_HOST: loan-db
      LOAN_DB_PORT: 5432
      LOAN_DB_NAME: ${LOAN_DB_NAME:-loan_db}
      LOAN_DB_USER: ${LOAN_DB_USER:-loan}
      LOAN_DB_PASSWORD: ${LOAN_DB_PASSWORD:-loan}
      COMMON_DB_HOST: common-db
      COMMON_DB_PORT: 5432
      COMMON_DB_NAME: ${COMMON_DB_NAME:-common_db}
      COMMON_DB_USER: ${COMMON_DB_USER:-common}
      COMMON_DB_PASSWORD: ${COMMON_DB_PASSWORD:-common}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      # 여신 자금이동(실행·자동이체·온라인상환·역분개)이 결제를 거치는 경로다.
      # 이 값이 없으면 loan 의 기본값 http://localhost:8080 으로 떨어지는데,
      # 컨테이너 안의 localhost:8080 은 아무것도 아니라 Connection refused 가 난다.
      # 그 탓에 도커 스택에서 여신 자금이동이 한 번도 성공한 적이 없다 —
      # 근거는 docs/plan/loan-payment-ledger-trace.md.
      PAYMENT_SERVICE_URL: http://core-banking-a:8082
      # 여신의 서비스 자격증명. 이 값의 SHA-256 이 core_banking 의
      # service_principal.credential_hash(V32)와 맞아야 신원이 선다.
      #
      # 서비스마다 자기 값을 갖는다. 공유 토큰을 쓰면 신원이 하나가 되어,
      # 그 토큰을 가진 무엇이든 여신을 사칭할 수 있다.
      #
      # 기본값의 'dev-secret' 은 의도된 표식이다 — DevSecretGuard 가 운영
      # 프로파일에서 이 표식을 보고 기동을 거부한다.
      LOAN_SERVICE_CREDENTIAL: ${LOAN_SERVICE_CREDENTIAL:-dev-secret-loan-service-credential}
      CRYPTO_KEY_BASE64: ${CRYPTO_KEY_BASE64:-aW50ZXJuZXQtYmFuay1kZXYta2V5LTMyYnl0ZXMhISE=}
      LOG_DIR: /logs
      # 서류 원본 보관. 기본 스택은 filesystem + 영속 볼륨을 쓴다.
      # MinIO 로 바꾸려면 --profile doc 로 minio 를 띄우고 아래 두 줄을 바꾼다:
      #   LOAN_DOCUMENT_STORAGE_TYPE: s3
      #   STORAGE_ENDPOINT: http://minio:9000
      LOAN_DOCUMENT_STORAGE_TYPE: ${LOAN_DOCUMENT_STORAGE_TYPE:-filesystem}
      LOAN_DOCUMENT_STORAGE_DIR: /var/lib/loan-documents
      LOAN_DOCUMENT_BUCKET: ${LOAN_DOCUMENT_BUCKET:-loan-documents}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-http://minio:9000}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-minioadmin}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-minioadmin}
      SPRING_FLYWAY_REPAIR_ON_MIGRATE: "true"
    volumes:
      - C:/logs/internet-banking:/logs
      - loan-document-data:/var/lib/loan-documents
    depends_on:
      loan-db:
        condition: service_healthy
      common-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    # 사이드카와 통신해야 하므로 agent-net 에도 붙는다.
    networks:
      - default
      - agent-net
      - agent-closed
    # 자문 병합으로 커졌다
    mem_limit: 1g
  # B은행(다온뱅크) — 타행이체 상대 은행.
  #
  # 병합 전에는 payment-service 를 mock 프로필로 띄워 수신계를 가짜로 대체했다.
  # 그 Mock 은 아무것도 저장하지 않아서 "송금이 도착했는지" 확인할 대상이 없었다.
  # 이제 A와 똑같은 코어뱅킹을 자기 DB로 띄운다 — 실제 계좌에 실제로 입금된다.
  core-banking-b:
    build:
      context: .
      dockerfile: services/core-banking/Dockerfile
    container_name: ib-core-banking-b
    ports:
      - "${CORE_BANKING_PORT_B:-8180}:8082"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      CORE_BANKING_APP_PORT: 8082
      BANK_CODE: "B"
      CORE_BANKING_DB_HOST: core-banking-db-b
      CORE_BANKING_DB_PORT: 5432
      CORE_BANKING_DB_NAME: core_banking_b
      CORE_BANKING_DB_USER: core
      CORE_BANKING_DB_PASSWORD: core
      KFTC_KAFKA_BOOTSTRAP: kafka:29092
      BOK_KAFKA_BOOTSTRAP: kafka:29092
      INTERNAL_KAFKA_BOOTSTRAP: kafka:29092
      # 이상거래 사전 점검. 결제 임계 경로에 외부 호출을 넣는 변경이라 기본은 꺼 둔다 —
      # 탐지기가 안정적으로 뜨는 것을 확인한 뒤 DEPOSIT_FDS_ENABLED=true 로 켠다.
      DEPOSIT_FDS_ENABLED: ${DEPOSIT_FDS_ENABLED:-false}
      DEPOSIT_FDS_BASE_URL: http://fds-detector:8092
      DEPOSIT_FDS_TIMEOUT_MS: ${DEPOSIT_FDS_TIMEOUT_MS:-400}
      KFTC_CONSUMER_GROUP: core-banking-kftc-b
      BOK_CONSUMER_GROUP: core-banking-bok-b
      INTERNAL_CONSUMER_GROUP: core-banking-internal-b
      # 이 자리에는 SPRING_KAFKA_LISTENER_MISSING_TOPICS_FATAL 이 있었는데 코드가 읽지 않는 키였다
      # (정본은 payment.kafka.missing-topics-fatal — BokKafkaConfig 등의 @Value).
      # 즉 토픽 누락 시 죽지 않게 하려던 의도가 실제로는 적용된 적이 없다.
      #
      # 그래서 끄는 대신 순서를 보장한다. 토픽은 payment-topic-init 이 만들고, 아래
      # depends_on 이 그 완료를 기다린다. 없는 토픽에 붙으면 죽는 편이 낫다 —
      # 조용히 뜬 뒤 리스너만 죽어 있으면 결제 이벤트가 유실된다.
      APP_CORS_ENABLED: "true"
      LOG_DIR: /logs
    volumes:
      - C:/logs/internet-banking:/logs
    depends_on:
      core-banking-db-b:
        condition: service_healthy
      kafka:
        condition: service_healthy
      payment-topic-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/api/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    # 시연용이라 부하가 낮다
    mem_limit: 768m
  auto-loan-review:
    build:
      context: .
      dockerfile: agents/auto-loan-review/Dockerfile
    # 호스트에 포트를 열지 않는다. loan-service 만 부르는 서비스 간 API 라
    # 밖에서 닿을 이유가 없다.
    #
    # 예전에는 "포트를 게시해야 Prometheus 가 긁는다" 는 이유로 열려 있었다. 그런데
    # Prometheus 는 같은 compose 망에 있으므로 컨테이너 이름으로도 긁을 수 있다 —
    # 지표 때문에 열어 둘 필요가 없었다. prometheus.yml 을 auto-loan-review:8089 로
    # 바꿨다.
    container_name: ib-auto-loan-review
    environment:
      AUTO_LOAN_REVIEW_APP_PORT: ${AUTO_LOAN_REVIEW_APP_PORT:-8089}
      # 서비스 간 호출 토큰. loan-service 가 AUTO_REVIEW_INTERNAL_TOKEN 으로 보내는
      # 값과 같아야 한다. 비면 /api/ai/* 와 /api/internal/* 이 전부 거부된다 —
      # 신원을 확인할 수 없는데 통과시키면 검사가 있다는 착각만 남는다(fail-safe).
      AI_INTERNAL_TOKEN: ${INTERNAL_SERVICE_TOKEN:-local-internal-token}
      AI_DB_HOST: ai-db
      AI_DB_PORT: 5432
      AI_DB_NAME: ${AI_DB_NAME:-ai_db}
      AI_DB_USER: ${AI_DB_USER:-ai}
      AI_DB_PASSWORD: ${AI_DB_PASSWORD:-ai}
      AI_DB_URL: jdbc:postgresql://ai-db:5432/${AI_DB_NAME:-ai_db}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SPRING_PROFILES_ACTIVE: docker
      LOG_DIR: /logs
      AI_LLM_PROVIDER: ${GEMINI_LOAN_PROVIDER:-stub}
      AI_LLM_MODEL: ${GEMINI_LOAN_MODEL:-stub-v1}
      GEMINI_BASE_URL: ${GEMINI_LOAN_BASE_URL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # 하네스 추적 → Phoenix. LANGFUSE_ENABLED 가 있었으나 읽는 코드가 없었다.
      HARNESS_TRACING_ENABLED: ${PHOENIX_ENABLED:-false}
      HARNESS_TRACING_ENDPOINT: http://phoenix:6006/v1/traces
    volumes:
      - C:/logs/internet-banking:/logs
    depends_on:
      ai-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${AUTO_LOAN_REVIEW_APP_PORT:-8089}/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    # default 에서 뺐다. 이 서비스의 인가는 게이트웨이가 주입한 신원 헤더에
    # 기대는데, 기본망에 있으면 41개 서비스 중 아무나 직접 부를 수 있다.
    # agent-net 에는 이 서비스가 필요로 하는 상대와 부르는 쪽만 둔다.
    networks:
      - agent-closed
    # ML 추론 + RAG
    mem_limit: 1g
  # 이상거래 조사 에이전트 (사이드카)
  #
  # **ports 를 두지 않는다.** 호스트에 8090 이 열리면 브라우저가 게이트웨이를 우회해
  # X-Employee-Id 를 손으로 붙일 수 있고, 그러면 "게이트웨이가 주입한 신원이라 믿는다"는
  # 전제가 무너진다. 승인 기록의 신뢰가 통째로 사라지는 지점이라 편의보다 우선한다.
  # 로컬에서 직접 찔러봐야 하면 docker-compose.override.yml 로 그 개발자만 연다
  # (docker-compose.override.sample.yml 참조).
  fraud-agent:
    build:
      context: agents
      dockerfile: fraud-investigation-agent/Dockerfile
    container_name: ib-fraud-agent
    environment:
      # 감사 기록 저장소. 미설정이면 감사가 NoOp 이라 조사 기록이 남지 않는다.
      FRAUD_AUDIT_DSN: ${FRAUD_AUDIT_DSN:-}
      # 게이트웨이만 아는 값. 이것이 일치할 때만 신원 헤더를 믿는다.
      FRAUD_GATEWAY_SHARED_SECRET: ${FRAUD_GATEWAY_SHARED_SECRET:-}
      # 탐지기만 아는 값. 게이트웨이 시크릿과 뜻이 달라 나눠 둔다 — 이쪽은
      # "기계가 직접 넘겼다" 이고, 비어 있으면 사후 탐지가 넘기는 사건이 전부
      # 403 으로 되튀어 조사 큐가 비어 있게 된다.
      FRAUD_DISPATCH_SHARED_SECRET: ${FRAUD_DISPATCH_SHARED_SECRET:-}
      # 연령대 조회용. 없으면 맞춤 안내가 조용히 기본형으로 내려간다.
      TRIAGE_BACKEND_URL: ${TRIAGE_BACKEND_URL:-http://customer-service:8081}
      TRIAGE_USER_ID: ${TRIAGE_USER_ID:-1}
      TRIAGE_USER_ROLE: ${TRIAGE_USER_ROLE:-ROLE_HQ_RISK}
      # 조사 루프를 Phoenix 로 남긴다. 끄면 계측 전체가 no-op 이다.
      PHOENIX_ENABLED: ${PHOENIX_ENABLED:-false}
      PHOENIX_GRPC_ENDPOINT: http://phoenix:4317
      PHOENIX_PROJECT: fraud-investigation
      # 가명처리 소금. 미설정이면 재기동마다 같은 고객이 다른 가명이 되어
      # "같은 고객의 조사 3건" 을 묶을 수 없다.
      AGENT_PII_SALT: ${AGENT_PII_SALT:-}
    networks:
      - fraud-internal
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8090/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    # LangGraph 조사 루프
    mem_limit: 768m
  consultation-service:
    build:
      # 컨텍스트가 agents/ 인 이유: harness-core/python 의 공유 감사 계약을
      # 이미지에 담아야 한다 (docs/decisions/agent-harness-consolidation.md 2-d).
      # 전송량은 agents/.dockerignore 가 막는다.
      context: agents
      dockerfile: consultation/Dockerfile
    container_name: ib-consultation-service
    # 호스트에 포트를 열지 않는다.
    #
    # 이 서비스의 인가는 "게이트웨이가 주입한 신원 헤더"에 기대는데, 8087 이 밖에서
    # 닿으면 게이트웨이를 건너뛰고 부르면 그만이다. 공유 시크릿은 그때를 위한 최소
    # 방어선일 뿐이고, 근본 해법은 포트를 닫는 것이다.
    #
    # 게이트웨이는 컨테이너 이름(consultation-service:8087)으로 부르므로 영향 없다.
    # 로컬에서 게이트웨이를 호스트에 띄우거나 직접 호출로 시험하려면
    # docker-compose.override.sample.yml 의 안내를 따른다.
    environment:
      # 상담 흐름을 Phoenix 로 남긴다. 끄면 계측 전체가 no-op 이다.
      PHOENIX_ENABLED: ${PHOENIX_ENABLED:-false}
      PHOENIX_GRPC_ENDPOINT: http://phoenix:4317
      PHOENIX_PROJECT: consultation
      # 가명처리 소금. 미설정이면 재기동마다 같은 고객이 다른 가명이 된다.
      AGENT_PII_SALT: ${AGENT_PII_SALT:-}
      # 수신 데이터는 core_banking DB 의 deposit 스키마로 옮겨졌다.
      CONSULTATION_DATABASE_URL: postgresql+psycopg://${CORE_BANKING_DB_USER:-core}:${CORE_BANKING_DB_PASSWORD:-core}@core-banking-db-a:5432/${CORE_BANKING_DB_NAME:-core_banking}?options=-csearch_path%3Ddeposit
      # 챗봇 이체는 core-banking 을 거친다(락·멱등키·한도·소유권 검증).
      # 기본값은 localhost 라 컨테이너 안에서는 반드시 지정해야 한다.
      CONSULTATION_CORE_BANKING_URL: http://core-banking-a:8082
      CONSULTATION_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      CONSULTATION_KAFKA_ENABLED: "false"
      # 게이트웨이와 나눠 갖는 시크릿. 이 값이 비면 직원용 조회(STAFF_*)가 거절된다 —
      # 신원을 확인할 수 없는데 열람을 허용하면 감사 기록만 그럴듯해진다(fail-closed).
      # 게이트웨이의 CONSULTATION_GATEWAY_SHARED_SECRET 와 같은 값이어야 한다.
      CONSULTATION_GATEWAY_SHARED_SECRET: ${CONSULTATION_GATEWAY_SHARED_SECRET:-}
      CONSULTATION_OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CONSULTATION_OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      GOAL_AGENT_ENABLED: ${GOAL_AGENT_ENABLED:-true}
      GOAL_AGENT_URL: ${GOAL_AGENT_URL:-http://host.docker.internal:8000}
      GOAL_AGENT_API_KEY: ${GOAL_AGENT_API_KEY:-}
      # 만기·지출 에이전트. 기본값이 false 였고, 그래서 1,037줄이 도는 일 없이
      # 남아 있었다. 실제로 켜서 돌려 보니 둘 다 정상 동작한다 —
      # 실제 거래·계약 데이터를 읽어 계산하고, **LLM 을 부르지 않는다**(순수 계산).
      # 비용도 오동작도 이유가 아니었고, 켜는 것을 잊은 쪽이었다.
      #
      # 셋이 같은 성격인데 GOAL 만 true 였던 근거는 커밋에도 남아 있지 않다
      # (#150 이 셋을 함께 넣으면서 둘만 false 로 뒀다).
      MATURITY_AGENT_ENABLED: ${MATURITY_AGENT_ENABLED:-true}
      SPENDING_AGENT_ENABLED: ${SPENDING_AGENT_ENABLED:-true}
      LOG_DIR: /logs
    volumes:
      - C:/logs/internet-banking:/logs
    depends_on:
      core-banking-db-a:
        condition: service_healthy
    healthcheck:
      # 파이썬 이미지에는 wget·curl 이 없다. wget 으로 검사하면 앱이 멀쩡해도
      # 영원히 unhealthy 이고, depends_on: service_healthy 를 건 것이 안 뜬다.
      # 조사 에이전트는 이미 파이썬으로 검사하고 있었다 — 여기만 남아 있었다.
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8087/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    # default 에서 뺐다. 이 서비스의 인가는 게이트웨이가 주입한 신원 헤더에
    # 기대는데, 기본망에 있으면 41개 서비스 중 아무나 직접 부를 수 있다.
    # agent-net 에는 이 서비스가 필요로 하는 상대와 부르는 쪽만 둔다.
    networks:
      - agent-net
    # Python 런타임 + RAG 임베딩
    mem_limit: 768m
  mock-responder:
    image: python:3.12-alpine
    container_name: ib-mock-responder
    command: >
      sh -c "pip install --quiet kafka-python-ng==2.2.3 && python /app/responder.py"
    volumes:
      - ./services/core-banking/mock:/app:ro
    environment:
      KFTC_BOOTSTRAP: kafka:29092
      BOK_BOOTSTRAP:  kafka:29092
      SUCCESS_RATE:   "${SUCCESS_RATE:-1.0}"
      DELAY_MS:       "${DELAY_MS:-300}"
    depends_on:
      kafka:
        condition: service_healthy
      payment-topic-init:
        condition: service_completed_successfully
    restart: on-failure
    profiles:
      - mock
    mem_limit: 256m
  # =============================================================
  # Monitoring — Metrics (Prometheus + Grafana)
  # =============================================================

  prometheus:
    image: prom/prometheus:latest
    container_name: ib-prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./infra/prometheus/rules.yml:/etc/prometheus/rules.yml:ro
      - prometheus-data:/prometheus
    # 보관 기간·용량을 명시한다. 기본값(15일, 무제한 용량)으로 두면 로컬 디스크가
    # 조용히 차오르고, 어디까지 볼 수 있는지도 사람마다 다르게 안다.
    #
    # Prometheus 자체에는 다운샘플링이 없다. 오래된 데이터를 성글게 보관하려면
    # Thanos·Mimir 같은 장기 저장소가 필요하다 — 여기서는 recording rule 로 조회
    # 비용을 줄이고 보관량을 제한하는 선까지만 한다.
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-15d}
      - --storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-4GB}
      - --web.enable-lifecycle
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    # fraud-agent 는 internal 망에 격리돼 호스트로 포트를 열지 않는다(의도된 설계 —
    # 8090 이 브라우저에 직접 닿으면 신원 헤더 위조가 가능해진다. api.py 주석 참고).
    # 그래서 포트를 여는 대신 Prometheus 를 그 망에 함께 넣어 안에서 긁는다.
    # 기본망 소속은 유지해야 나머지 대상을 계속 긁을 수 있다.
    networks:
      - default
      - fraud-internal
      - agent-net
      - agent-closed
    # 보존기간에 비례. 늘면 함께 올릴 것
    mem_limit: 1g
  grafana:
    image: grafana/grafana:latest
    container_name: ib-grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_METRICS_ENABLED: "true"
      # ── 어드민 화면(/admin/monitoring) 임베드용 ── 로컬 전용이다. ──────────────
      # Grafana 는 기본으로 X-Frame-Options: deny 를 내려 iframe 을 막는다. 그것을 풀고,
      # 익명 Viewer 를 켜서 어드민에서 별도 로그인 없이 대시보드가 보이게 한다.
      #
      # 이 두 줄을 prod(infra/docker/docker-compose.prod.yml)로 옮기지 말 것.
      # iframe 은 서버가 아니라 방문자 브라우저가 직접 가져오므로, 배포 환경에서
      # 이렇게 하려면 Grafana 를 인터넷에 공개해야 한다. 그러면 누구나 인증 없이
      # 전체 지표를 조회할 수 있다. prod 는 api-gateway(8080) 하나만 노출하고
      # Grafana 는 내부망에 두는 구성이며, 그 구성을 되돌리는 변경이다.
      # 배포까지 가려면 게이트웨이가 JWT 를 검증한 뒤 넘기는 auth proxy 로 가야 한다.
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_limit: 512m
  alertmanager:
    image: prom/alertmanager:latest
    container_name: ib-alertmanager
    ports:
      - "${ALERTMANAGER_PORT:-9095}:9093"
    environment:
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL}
      HEALTHCHECKS_PING_URL: ${HEALTHCHECKS_PING_URL}
    entrypoint:
      - /bin/sh
      - -c
      - |
        : "$${SLACK_WEBHOOK_URL:?SLACK_WEBHOOK_URL이 .env에 설정되어 있지 않습니다}"
        : "$${HEALTHCHECKS_PING_URL:?HEALTHCHECKS_PING_URL이 .env에 설정되어 있지 않습니다}"
        sed -e "s|__SLACK_WEBHOOK_URL__|$$SLACK_WEBHOOK_URL|g" \
            -e "s|__HEALTHCHECKS_PING_URL__|$$HEALTHCHECKS_PING_URL|g" \
            /etc/alertmanager/alertmanager.yml.template \
            > /tmp/alertmanager.yml && \
        exec /bin/alertmanager --config.file=/tmp/alertmanager.yml
    volumes:
      - ./infra/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml.template:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9093/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    mem_limit: 256m
  blackbox-exporter:
    image: prom/blackbox-exporter:latest
    container_name: ib-blackbox-exporter
    ports:
      - "${BLACKBOX_PORT:-9115}:9115"
    command: --config.file=/etc/blackbox/blackbox.yml
    volumes:
      - ./infra/blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9115/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    mem_limit: 128m
  # =============================================================
  # Monitoring — Logging (Loki + Promtail)
  # =============================================================

  loki:
    image: grafana/loki:latest
    container_name: ib-loki
    ports:
      - "${LOKI_PORT:-3100}:3100"
    command: -config.file=/etc/loki/config.yml
    volumes:
      - ./infra/loki/loki-config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    healthcheck:
      disable: true
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_limit: 512m
  promtail:
    image: grafana/promtail:latest
    container_name: ib-promtail
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./infra/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - C:/logs/internet-banking:/logs:ro
    depends_on:
      loki:
        condition: service_started
    # 로그 수집 에이전트
    mem_limit: 256m
  # =============================================================
  # Monitoring — LLM/Agent Tracing (Phoenix)
  # =============================================================

  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: ib-phoenix
    ports:
      - "${PHOENIX_PORT:-6006}:6006"
      - "${PHOENIX_GRPC_PORT:-4317}:4317"
    environment:
      PHOENIX_WORKING_DIR: /phoenix
    volumes:
      - phoenix-data:/phoenix
    # 닫힌 망의 에이전트도 추적을 보내야 한다. 사이드카들이 각자 다른 망에 있으므로
    # 수집기가 그 망에 다 있어야 닿는다(예전 langfuse 가 같은 이유로 이 목록을 썼다).
    # 반대로 에이전트가 이걸 통해 밖으로 나가지는 못한다 — 소속 망이 늘어난 것은
    # 수집기지 에이전트가 아니고, OTLP 수집기는 임의 트래픽을 중계하지 않는다.
    networks:
      - default
      - fraud-internal
      - agent-net
      - agent-closed
    # Python 런타임
    mem_limit: 768m
  # =============================================================
  # Application
  # =============================================================

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    container_name: ib-gateway
    ports:
      - "${GATEWAY_APP_PORT:-8080}:8080"
    environment:
      GATEWAY_APP_PORT: 8080
      LOG_DIR: /logs
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-internet-banking-jwt-secret-key-must-be-at-least-32-chars!!}
      CUSTOMER_SERVICE_HOST: customer-service
      CUSTOMER_SERVICE_PORT: 8081
      DEPOSIT_SERVICE_HOST: core-banking-a
      DEPOSIT_SERVICE_PORT: 8082
      LOAN_SERVICE_HOST: loan-service
      LOAN_SERVICE_PORT: ${LOAN_APP_PORT:-8083}
      # 결제도 같은 서비스로 간다 — 병합 후 하나의 코어뱅킹이다.
      PAYMENT_SERVICE_HOST: core-banking-a
      PAYMENT_SERVICE_PORT: 8082
      AI_SERVICE_HOST: auto-loan-review
      AI_SERVICE_PORT: ${AUTO_LOAN_REVIEW_APP_PORT:-8089}
      FRAUD_AGENT_HOST: fraud-agent
      FRAUD_AGENT_PORT: 8090
      CONSULTATION_SERVICE_HOST: consultation-service
      CONSULTATION_SERVICE_PORT: 8087
      DOC_AGENT_HOST: doc-agent
      DOC_AGENT_PORT: 8087
      # 게이트웨이를 거쳤음을 사이드카에 증명하는 값. 비어 있으면 사이드카는
      # 신원 헤더를 전혀 믿지 않는다(fail-closed) — 감사에 actor_id 가 NULL 로 남는다.
      #
      # 각 사이드카의 같은 이름 변수와 값이 맞아야 한다. 한쪽만 넣으면 조용히
      # 거절되고 원인이 안 보인다.
      FRAUD_GATEWAY_SHARED_SECRET: ${FRAUD_GATEWAY_SHARED_SECRET:-not-configured}
      CONSULTATION_GATEWAY_SHARED_SECRET: ${CONSULTATION_GATEWAY_SHARED_SECRET:-not-configured}
      DOC_AGENT_GATEWAY_SHARED_SECRET: ${DOC_AGENT_GATEWAY_SHARED_SECRET:-not-configured}
    # 기본 네트워크에 더해 fraud 전용 내부망에도 붙는다.
    # default 를 명시하지 않으면 이 서비스만 기본망에서 빠져 다른 서비스와 끊긴다.
    networks:
      - default
      - fraud-internal
      - agent-net
      - agent-closed
    volumes:
      - C:/logs/internet-banking:/logs
    depends_on:
      customer-service:
        condition: service_healthy
      core-banking-a:
        condition: service_healthy
      loan-service:
        condition: service_healthy
      auto-loan-review:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 5
    # MaxRAMPercentage=75 → 힙 576m. 라우팅만 하므로 가볍다
    mem_limit: 768m
  # ── doc-agent 전용 (profile: doc) ─────────────────────────────────────────
  doc-agent-db:
    profiles: ["doc"]
    image: postgres:16-alpine
    container_name: ib-doc-agent-db
    environment:
      POSTGRES_DB: ${DOC_AGENT_DB_NAME:-doc_agent_db}
      POSTGRES_USER: ${DOC_AGENT_DB_USER:-docagent}
      POSTGRES_PASSWORD: ${DOC_AGENT_DB_PASSWORD:-docagent}
    ports:
      # 5438은 common-db가 사용 → doc-agent-db는 5440 (start.ps1 DOC_AGENT_DB_PORT와 일치)
      - "${DOC_AGENT_DB_PORT:-5440}:5432"
    volumes:
      - doc-agent-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DOC_AGENT_DB_USER:-docagent} -d ${DOC_AGENT_DB_NAME:-doc_agent_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # 사이드카와 통신해야 하므로 agent-net 에도 붙는다.
    networks:
      - default
      - agent-net
    # postgres 기본 shared_buffers 로 충분한 데모 규모
    mem_limit: 512m
  minio:
    profiles: ["doc"]
    image: minio/minio:latest
    container_name: ib-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    # 사이드카와 통신해야 하므로 agent-net 에도 붙는다.
    networks:
      - default
      - agent-net
    mem_limit: 512m
  vault:
    profiles: ["doc"]
    image: hashicorp/vault:1.15
    container_name: ib-vault
    command: server -dev -dev-root-token-id=root
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      - "${VAULT_PORT:-8200}:8200"
    cap_add:
      - IPC_LOCK
    healthcheck:
      # localhost 가 아니라 127.0.0.1 을 쓴다.
      # 컨테이너의 /etc/hosts 는 localhost 를 127.0.0.1 과 ::1 둘 다에 매핑하는데,
      # vault -dev 는 IPv4(0.0.0.0:8200)에만 붙는다. wget 이 ::1 을 먼저 잡으면
      # "Connection refused" 가 나고 헬스체크가 영원히 실패한다.
      # 그러면 depends_on 이 걸린 doc-agent 가 아예 뜨지 못한다(doc 프로필 전체가 막힌다).
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8200/v1/sys/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    # 사이드카와 통신해야 하므로 agent-net 에도 붙는다.
    networks:
      - default
      - agent-net
    mem_limit: 256m
  # ── RAG 전용 (profile: rag) ───────────────────────────────────────────────
  kafka-connect:
    profiles: ["rag"]
    build:
      context: ./infra/kafka-connect
      dockerfile: Dockerfile
    container_name: ib-kafka-connect
    ports:
      # 호스트 8083은 loan-service 정규 포트(LOAN_APP_PORT)와 충돌 → Connect는 18083으로 게시
      # (컨테이너 내부 CONNECT_REST_PORT/내부 통신은 8083 그대로)
      - "${KAFKA_CONNECT_PORT:-18083}:8083"
    environment:
      CONNECT_BOOTSTRAP_SERVERS: kafka:29092
      CONNECT_REST_PORT: 8083
      CONNECT_GROUP_ID: ib-connect-group
      CONNECT_CONFIG_STORAGE_TOPIC: _connect-configs
      CONNECT_OFFSET_STORAGE_TOPIC: _connect-offsets
      CONNECT_STATUS_STORAGE_TOPIC: _connect-status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_REST_ADVERTISED_HOST_NAME: kafka-connect
      CONNECT_PLUGIN_PATH: /usr/share/java,/usr/share/confluent-hub-components
    depends_on:
      kafka:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8083/connectors || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
    # JVM 커넥트 워커
    mem_limit: 1g
  kafka-connect-init:
    profiles: ["rag"]
    image: curlimages/curl:8.7.1
    container_name: ib-kafka-connect-init
    depends_on:
      kafka-connect:
        condition: service_healthy
    volumes:
      - ./infra/kafka-connect/connectors:/connectors:ro
      - ./infra/kafka-connect/register-connectors.sh:/register-connectors.sh:ro
    entrypoint: ["/bin/sh", "/register-connectors.sh"]
    restart: on-failure

  elasticsearch:
    profiles: ["rag"]
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: ib-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx2g
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "${ES_PORT:-9200}:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=10s || exit 1"]
      interval: 15s
      timeout: 15s
      retries: 10
    # 사이드카와 통신해야 하므로 agent-net 에도 붙는다.
    networks:
      - default
      - agent-net
    # -Xmx2g + 루씬 오프힙. 힙의 1.5배
    mem_limit: 3g
  kibana:
    profiles: ["rag"]
    image: docker.elastic.co/kibana/kibana:8.15.0
    container_name: ib-kibana
    ports:
      - "${KIBANA_PORT:-5601}:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - xpack.security.enabled=false
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5601/api/status || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
    # 공식 최소 권장
    mem_limit: 1g
  # ── 이상거래 탐지 (FDS 탐지 단계) ─────────────────────────────────────────
  # payment.completed 를 별도 컨슈머 그룹으로 구독한다. 결제계·회계계가 쓰는 그룹과
  # 겹치면 서로 이벤트를 나눠 갖게 되어 양쪽 다 일부만 보게 된다.
  fds-detector:
    build:
      context: .
      dockerfile: services/fds-detector/Dockerfile
    container_name: ib-fds-detector
    ports:
      - "${FDS_DETECTOR_PORT:-8092}:8092"
    environment:
      FDS_DETECTOR_PORT: 8092
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CORE_BANKING_URL: http://core-banking-a:8082
      FRAUD_AGENT_URL: http://fraud-agent:8090
      # 사이드카와 같아야 한다. 다르면 조사 인계가 403 이다.
      FRAUD_DISPATCH_SHARED_SECRET: ${FRAUD_DISPATCH_SHARED_SECRET:-}
      FDS_CONSUMER_GROUP: ${FDS_CONSUMER_GROUP:-fds-detector}
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8092/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    # fraud-agent 는 전용 내부망에만 있다. 여기에 붙지 않으면 탐지 후 조사 위임이
    # 통째로 실패한다 — 컨테이너는 멀쩡히 뜨고 그 호출만 조용히 죽는다.
    networks:
      - default
      - fraud-internal
    # 힙 576m
    mem_limit: 768m
  doc-agent:
    profiles: ["doc"]
    build:
      context: .
      dockerfile: agents/doc-agent/Dockerfile
    container_name: ib-doc-agent
    # 호스트에 포트를 열지 않는다 — 상담 서비스와 같은 이유다.
    #
    # 심사 결정(누가 위조를 확정했는가)과 법적보존 해제가 이 서비스에 있다. 밖에서
    # 닿으면 게이트웨이를 건너뛸 수 있고, 그러면 채택률 지표의 근거가 자칭이 된다.
    #
    # 부수 효과로 포트 충돌도 사라졌다. consultation-service 와 둘 다 8087 을 쓰는데,
    # 컨테이너 안에서는 서로 다른 네트워크 이름이라 겹치지 않는다.
    environment:
      DOC_AGENT_APP_PORT: 8087
      # 게이트웨이와 나눠 갖는 시크릿. 비면 신원 헤더를 믿지 않아 심사 결정·법적보존이
      # 거절된다 — 누가 결정했는지 확인할 수 없는데 통과시키면 채택률 지표의 근거가
      # 자칭이 된다(fail-closed).
      DOC_AGENT_GATEWAY_SHARED_SECRET: ${DOC_AGENT_GATEWAY_SHARED_SECRET:-}
      DOC_AGENT_DB_HOST: doc-agent-db
      DOC_AGENT_DB_PORT: 5432
      DOC_AGENT_DB_NAME: ${DOC_AGENT_DB_NAME:-doc_agent_db}
      DOC_AGENT_DB_USER: ${DOC_AGENT_DB_USER:-docagent}
      DOC_AGENT_DB_PASSWORD: ${DOC_AGENT_DB_PASSWORD:-docagent}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      REDIS_HOST: redis
      REDIS_PORT: 6379
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-minioadmin}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-minioadmin}
      # common 의 CryptoProperties 는 기본값이 없다(fail-fast). 안 넘기면 cryptoService 빈
      # 생성이 NPE 로 터져 부팅 자체가 안 된다. 다른 서비스와 같은 개발용 기본값을 쓴다.
      CRYPTO_KEY_BASE64: ${CRYPTO_KEY_BASE64:-aW50ZXJuZXQtYmFuay1kZXYta2V5LTMyYnl0ZXMhISE=}
      VAULT_ENABLED: "true"
      VAULT_HOST: vault
      VAULT_PORT: 8200
      VAULT_TOKEN: root
      INFERENCE_SERVER_URL: http://inference-server:8090
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      DRIVER_LICENSE_API_KEY: ${DRIVER_LICENSE_API_KEY:-}
      DRIVER_LICENSE_API_ENABLED: ${DRIVER_LICENSE_API_ENABLED:-false}
    depends_on:
      doc-agent-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
      vault:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8087/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 5
    # default 에서 뺐다. 이 서비스의 인가는 게이트웨이가 주입한 신원 헤더에
    # 기대는데, 기본망에 있으면 41개 서비스 중 아무나 직접 부를 수 있다.
    # agent-net 에는 이 서비스가 필요로 하는 상대와 부르는 쪽만 둔다.
    networks:
      - agent-net
    # -Xmx384m + JVM 오버헤드
    mem_limit: 512m
  review-ai-gateway:
    build:
      context: .
      dockerfile: agents/review-ai-gateway/Dockerfile
    container_name: ib-review-ai-gateway
    # 호스트에 포트를 열지 않는다 — 자문 도구 분석만 하는 서비스 간 API 다.
    #
    # 부수 효과: 8088 은 로컬에서 api-gateway 를 띄울 때 쓰는 포트라 오래 혼동을
    # 일으켰다. 닫으면서 그 충돌도 사라졌다.
    environment:
      AIGATEWAY_APP_PORT: 8088
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_PROFILES_ACTIVE: docker
      LOG_DIR: /logs
      LOAN_SERVICE_URL: http://loan-service:8083
      AI_SERVICE_BASE_URL: http://auto-loan-review:8089
      # advisory 는 loan-service 안에 있다 (별도 서비스로 존재한 적 없음).
      ADVISORY_BASE_URL: http://loan-service:8083
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      CLAUDE_API_KEY: ${CLAUDE_API_KEY:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-opus-4-7}
      # 하네스 추적 → Phoenix. LANGFUSE_ENABLED 가 있었으나 읽는 코드가 없었다.
      HARNESS_TRACING_ENABLED: ${PHOENIX_ENABLED:-false}
      HARNESS_TRACING_ENDPOINT: http://phoenix:6006/v1/traces
    volumes:
      - C:/logs/internet-banking:/logs
    depends_on:
      kafka:
        condition: service_healthy
      loan-service:
        condition: service_healthy
      auto-loan-review:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8088/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    # default 에서 뺐다. 이 서비스의 인가는 게이트웨이가 주입한 신원 헤더에
    # 기대는데, 기본망에 있으면 41개 서비스 중 아무나 직접 부를 수 있다.
    # agent-net 에는 이 서비스가 필요로 하는 상대와 부르는 쪽만 둔다.
    networks:
      - agent-closed
    # 힙 576m
    mem_limit: 768m
  kafka-exporter-kftc:
    image: danielqsj/kafka-exporter:latest
    container_name: ib-kafka-exporter-kftc
    command:
      - "--kafka.server=kafka:29092"
    ports:
      - "${KAFKA_EXPORTER_KFTC_PORT:-9308}:9308"
    depends_on:
      kafka:
        condition: service_healthy
    restart: on-failure
    mem_limit: 128m
  kafka-exporter-bok:
    image: danielqsj/kafka-exporter:latest
    container_name: ib-kafka-exporter-bok
    command:
      - "--kafka.server=kafka:29092"
    ports:
      - "${KAFKA_EXPORTER_BOK_PORT:-9309}:9308"
    depends_on:
      kafka:
        condition: service_healthy
    restart: on-failure
    mem_limit: 128m
  kafka-exporter-internal:
    image: danielqsj/kafka-exporter:latest
    container_name: ib-kafka-exporter-internal
    command:
      - "--kafka.server=kafka:29092"
    ports:
      - "${KAFKA_EXPORTER_INTERNAL_PORT:-9310}:9308"
    depends_on:
      kafka:
        condition: service_healthy
    restart: on-failure
    mem_limit: 128m
volumes:
  customer-db-data:
  core-banking-db-a-data:
  core-banking-db-b-data:
  loan-db-data:
  loan-document-data:
  common-db-data:

  ai-db-data:
  redis-data:
  kafka-data:
  prometheus-data:
  grafana-data:
  doc-agent-db-data:
  minio-data:
  elasticsearch-data:
  loki-data:
  phoenix-data:

# =============================================================
# 네트워크
#
# 기본망(default)은 그대로 둔다 — 기존 서비스들의 토폴로지를 바꾸지 않기 위해서다.
# fraud-internal 만 새로 두고 거기에 붙는 것은 fraud-agent 와 api-gateway 둘뿐이다.
#
# internal: true 이면 이 네트워크는 외부로 라우팅되지 않는다. fraud-agent 는
# ports 도 없고 이 망에만 있으므로 **호스트·브라우저에서 도달할 수 없고**
# 게이트웨이를 거친 요청만 받는다. 그래야 "게이트웨이가 주입한 신원"이라는 전제가 선다.
# =============================================================
networks:
  default:
  # 사이드카 전용망. internal: true 로 두지 않는 이유는 이 서비스들이 외부 LLM
  # (Gemini·OpenAI)을 부르기 때문이다 — 막으면 추론이 폴백으로 조용히 흘러간다.
  # 격리 효과는 "기본망의 아무 서비스나 사이드카를 부를 수 있던 것" 을 없애는 데 있다.
  agent-net:
  # 유출까지 막는 사이드카망.
  #
  # internal: true 는 컨테이너 간 접근이 아니라 **바깥으로 나가는 것**을 막는다.
  # 격리(누가 부를 수 있는가)는 망 소속으로 이미 정해지므로, 이 설정이 더하는 것은
  # "털려도 밖으로 내보내지 못한다" 뿐이다.
  #
  # 여기 있는 둘(auto-loan-review·review-ai-gateway)은 기본 설정에서 바깥에 나갈 일이
  # 없다 — LLM 제공자 기본값이 각각 stub·mock 이다. 대출 신청자 정보를 다루는
  # 서비스라 유출 경로를 닫아 둘 값이 있다.
  #
  # ⚠ 실제 LLM(GEMINI_LOAN_PROVIDER·LLM_PROVIDER)을 켜면 이 망에서는 호출이 나가지
  #   못한다. 그때는 docker-compose.override.sample.yml 의 안내대로 agent-net 을
  #   함께 붙인다. 켜 두고 안 붙이면 추론이 폴백으로 조용히 흘러간다.
  agent-closed:
    internal: true
  fraud-internal:
    internal: true
